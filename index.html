<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カロリー帳">
<meta name="theme-color" content="#F4EFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<title>カロリー帳</title>
<style>
:root{
  --bg:#f3f4f2; --card:#ffffff; --ink:#1d2321; --sub:#6b7472; --line:#dfe3e0;
  --accent:#2f7d63; --accent-w:#e6f1ec;
  --in:#c2683f;      /* 摂取 */
  --out:#2f7d63;     /* 消費 */
  --minus:#2f7d63;   /* 収支マイナス＝よい */
  --plus:#c0492f;    /* 収支プラス＝オーバー */
  --shadow:0 1px 3px rgba(0,0,0,.07), 0 6px 18px rgba(0,0,0,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191a; --card:#1f2426; --ink:#e8ecea; --sub:#99a4a1; --line:#333b3d;
    --accent:#63c39f; --accent-w:#22322c;
    --in:#e08a5c; --out:#63c39f; --minus:#63c39f; --plus:#e8705a;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px; line-height:1.55;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}

/* ---- 画面わく ---- */
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
header.top{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding-top:calc(env(safe-area-inset-top) + 8px);
  border-bottom:1px solid transparent;
}
header.top.scrolled{border-bottom-color:var(--line)}
.datebar{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
.datebar .d{flex:1;text-align:center;font-weight:700;font-size:1.05rem}
.datebar .d small{display:block;font-weight:500;font-size:.72rem;color:var(--sub);letter-spacing:.04em}
.navbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);box-shadow:var(--shadow);font-size:1.1rem;color:var(--sub)}
.navbtn:active{transform:scale(.93)}
.today-chip{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 54px);
  font-size:.7rem;background:var(--accent-w);color:var(--accent);padding:3px 9px;border-radius:99px;font-weight:700}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2.sec{font-size:.82rem;letter-spacing:.06em;color:var(--sub);margin:18px 4px 8px;font-weight:700}

/* ---- 収支カード ---- */
.balance{text-align:center;padding:18px 14px 14px}
.balance .num{font-size:2.9rem;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.balance .num .u{font-size:1rem;font-weight:600;margin-left:3px}
.balance .lbl{font-size:.78rem;color:var(--sub);margin-bottom:6px}
.balance .note{font-size:.78rem;color:var(--sub);margin-top:8px}
.bars{margin-top:14px;display:grid;gap:9px}
.barrow{display:grid;grid-template-columns:3.2em 1fr 5.2em;align-items:center;gap:8px;font-size:.8rem}
.barrow .cap{color:var(--sub)}
.barrow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.track{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.goalbar{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:.8rem;color:var(--sub);
  display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goalbar b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---- 一覧 ---- */
.slot{margin-bottom:10px}
.slot-head{display:flex;align-items:center;gap:8px;padding:0 4px 5px}
.slot-head .t{font-weight:700;font-size:.9rem}
.slot-head .k{margin-left:auto;font-size:.8rem;color:var(--sub);font-variant-numeric:tabular-nums}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.94rem}
.item .nm em{font-style:normal;color:var(--sub);font-size:.8rem;margin-left:5px}
.item .kc{font-variant-numeric:tabular-nums;font-weight:700;font-size:.94rem}
.item .del{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--sub);font-size:1.1rem;flex:none}
.item .del:active{background:var(--line)}
.addrow{display:flex;align-items:center;gap:7px;padding:11px 13px;color:var(--accent);font-weight:700;font-size:.9rem;width:100%}
.addrow .p{width:21px;height:21px;border-radius:50%;background:var(--accent-w);display:grid;place-items:center;font-size:.95rem;line-height:1}
.empty{padding:16px 13px;color:var(--sub);font-size:.85rem;text-align:center}

/* ---- 体重 ---- */
.wrow{display:flex;align-items:center;gap:10px}
.wrow .lb{font-size:.9rem;font-weight:700}
.wrow input{flex:1;min-width:0;text-align:right;background:transparent;border:none;
  font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;padding:2px 0}
.wrow input:focus{outline:none}
.wrow .u{color:var(--sub);font-size:.9rem}
.wrow .diff{font-size:.78rem;color:var(--sub);font-variant-numeric:tabular-nums}

/* ---- 内訳 ---- */
.kv{display:flex;justify-content:space-between;font-size:.85rem;padding:5px 0}
.kv span:first-child{color:var(--sub)}
.kv b{font-variant-numeric:tabular-nums;font-weight:700}
.kv.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:9px}

/* ---- タブバー ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{padding:7px 0 6px;display:grid;justify-items:center;gap:2px;color:var(--sub);font-size:.66rem;font-weight:700}
nav.tabs button .ic{font-size:1.25rem;line-height:1.1}
nav.tabs button.on{color:var(--accent)}

/* ---- シート（追加パネル） ---- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:20px 20px 0 0;transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.9,.4,1);
  max-height:calc(var(--vvh,100vh)*.92);display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;padding:6px 14px 10px;flex:none}
.sheet .sh .ti{font-weight:800;font-size:1.02rem}
.sheet .sh .cl{margin-left:auto;color:var(--accent);font-weight:700;font-size:.9rem;padding:4px 2px}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px;margin:0 14px 10px;flex:none}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:.82rem;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 16px;flex:1}
.srch{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);margin-bottom:10px}
.srch:focus{outline:2px solid var(--accent-w);border-color:var(--accent)}
/* 検索中はシートの高さを固定し、検索欄を上に貼りつける。
   結果の件数でシートが伸び縮みすると、iPhoneでは入力欄がキーボードの裏へ動き、変換も切れる */
.sheet:has(.sbody > .srch){height:calc(var(--vvh,100vh)*.92)}
.sbody > .srch{position:sticky;top:0;z-index:2;box-shadow:0 0 0 6px var(--card)}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.pick .nm{flex:1;min-width:0;font-size:.94rem}
.pick .nm small{display:block;color:var(--sub);font-size:.72rem}
.pick .kc{color:var(--sub);font-size:.86rem;font-variant-numeric:tabular-nums}
.pick .st{width:28px;height:28px;border-radius:50%;background:var(--accent-w);color:var(--accent);
  display:grid;place-items:center;font-size:1.05rem;flex:none}
.pick:active{background:var(--bg)}
.qty{display:flex;gap:6px;margin:4px 0 12px}
.qty button{flex:1;padding:9px 0;border-radius:9px;background:var(--bg);font-weight:700;font-size:.85rem;color:var(--sub)}
.qty button.on{background:var(--accent);color:#fff}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:.76rem;color:var(--sub);font-weight:700;margin-bottom:4px}
.fld input,.fld select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.fld input:focus,.fld select:focus{outline:2px solid var(--accent-w);border-color:var(--accent)}
.fld .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:1rem;margin-top:4px}
.btn:active{opacity:.85}
.btn.sub{background:var(--bg);color:var(--ink)}
.btn.warn{background:var(--bg);color:var(--plus)}
.chk{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--sub);margin:8px 0 2px}
.chk input{width:19px;height:19px;accent-color:var(--accent)}

/* ---- 応援モード ---- */
:root{--cheer-a:#fff3e6;--cheer-b:#edf7f1;--cheer-bub:#ffffff;--cheer-ink:#3b3330;--cheer-line:#e4d8ca}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cheer-a:#efe2d3;--cheer-b:#dde9e1;--cheer-line:#cfc0ae}}
:root[data-theme="dark"]{--cheer-a:#efe2d3;--cheer-b:#dde9e1;--cheer-line:#cfc0ae}
.cheer{display:flex;gap:9px;align-items:flex-end;margin-bottom:12px;padding:10px 13px 10px 8px;
  border-radius:var(--r);box-shadow:var(--shadow);color:var(--cheer-ink);
  background:linear-gradient(155deg,var(--cheer-a),var(--cheer-b))}
.cheer .fig{width:94px;flex:none;text-align:center}
.cheer .fig img{width:94px;height:94px;display:block;object-fit:contain}
.cheer .nm{display:block;font-size:.62rem;font-weight:800;letter-spacing:.04em;opacity:.55;margin-top:1px}
.cheer .say{flex:1;min-width:0;background:var(--cheer-bub);border-radius:13px;padding:10px 12px;
  font-size:.86rem;line-height:1.65;position:relative;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.06)}
.cheer .say::after{content:"";position:absolute;left:-6px;bottom:12px;
  border:7px solid transparent;border-right-color:var(--cheer-bub);border-left-width:0}
.cheer .say b{color:#2f7d63}

/* ---- 写真でしらべる ---- */
.step{border-left:2px solid var(--line);padding:0 0 16px 15px;margin-left:9px;position:relative}
.step:last-of-type{border-left-color:transparent;padding-bottom:2px}
.step .no{position:absolute;left:-11px;top:1px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center}
.step h4{margin:0 0 5px;font-size:.92rem;font-weight:700}
.step p{margin:0 0 9px;font-size:.78rem;color:var(--sub);line-height:1.65}
a.btn{display:block;text-align:center;text-decoration:none}
textarea.ta{width:100%;min-height:104px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);resize:vertical;line-height:1.65;font-size:16px;font-family:inherit}
textarea.ta:focus{outline:2px solid var(--accent-w);border-color:var(--accent)}
textarea.ta.ro{height:190px;color:var(--sub);line-height:1.7}
.res{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
.res input[type=checkbox]{width:21px;height:21px;accent-color:var(--accent);flex:none}
.res .nm{flex:1;min-width:0;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res input[type=number]{width:4.7em;text-align:right;padding:6px 7px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);font-size:16px}
.res .u{font-size:.72rem;color:var(--sub)}
.res.off{opacity:.4}
.sumline{display:flex;justify-content:space-between;align-items:baseline;padding:11px 2px 4px;font-size:.85rem}
.sumline b{font-size:1.15rem;font-variant-numeric:tabular-nums}

/* ---- 履歴 ---- */
.hrow{display:grid;grid-template-columns:4.6em 1fr auto;gap:8px;align-items:center;
  padding:10px 13px;border-bottom:1px solid var(--line);font-size:.88rem}
.hrow:last-child{border-bottom:none}
.hrow .dd{color:var(--sub);font-size:.8rem;font-variant-numeric:tabular-nums}
.hrow .mini{display:flex;gap:1px;height:8px;align-items:center}
.hrow .bal{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:4.4em}
.chart{width:100%;height:150px;display:block}
.chart-lg{font-size:9px;fill:var(--sub)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat div b{display:block;font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat div span{font-size:.7rem;color:var(--sub)}

/* ---- 設定 ---- */
.help{font-size:.8rem;color:var(--sub);line-height:1.7}
.help b{color:var(--ink)}
.help ul{padding-left:1.15em;margin:6px 0}
details summary{font-weight:700;font-size:.9rem;cursor:pointer;padding:3px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";color:var(--sub)}
details[open] summary::before{content:"▾ "}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.85rem;font-weight:700;
  z-index:60;opacity:0;pointer-events:none;transition:.22s}
.toast.on{opacity:.95;transform:translate(-50%,0)}
.hide{display:none !important}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.datebar .d{border-radius:10px;padding:5px;min-height:44px}
.navbtn:disabled{opacity:.3;cursor:default}
.item button.nm{text-align:left;white-space:normal;overflow-wrap:anywhere}
.item .del{width:44px;height:44px}
.sheet{max-width:560px;margin:auto;visibility:hidden}
.sheet.on{visibility:visible}
.toast{max-width:calc(100% - 24px);border-radius:14px;text-align:center}
.toast button{margin-left:12px;text-decoration:underline;min-height:32px;font-weight:800}
.toast.on{pointer-events:auto}
.save-error{position:sticky;bottom:68px;z-index:70;background:#fff0ed;color:#802e20;padding:12px;border:2px solid #c0492f;margin:12px;border-radius:12px}
.app-title{font-size:.74rem;font-weight:700;letter-spacing:.12em;color:var(--accent);text-align:center;padding:4px 0}

/* ============================================================
   帳面（ちょうめん）テーマ — 生成りの地・墨の文字・柿色（食べた）・松葉色（使った）
   ============================================================ */
:root{
  --bg:#F4EFE4; --card:#FFFCF6; --ink:#1F1D1A; --sub:#6B6358; --line:#E7DECE; --line2:#EFE8DA; --faint:#A89E8E;
  --accent:#2E6A4F; --accent-w:#DDEBE2; --on-accent:#FFFCF6;
  --in:#C4552B; --in-w:#F6E2D5; --out:#2E6A4F; --out2:#5E9479; --out3:#8DB9A2;
  --minus:#2E6A4F; --plus:#C4552B;
  --share1:#C4552B; --share2:#D9825F; --share3:#E8AD90; --share4:#EBC9B8;
  --shadow:none; --r:22px;
  --f-num:"Fraunces",Georgia,serif;
  --f-head:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512; --card:#211F1B; --ink:#EEE8DC; --sub:#A89F90; --line:#34302A; --line2:#2B2823; --faint:#7D7568;
    --accent:#74C29B; --accent-w:#203A2E; --on-accent:#161512;
    --in:#E8825A; --in-w:#3D2A20; --out:#74C29B; --out2:#4F9A76; --out3:#2F6B50;
    --minus:#74C29B; --plus:#E8825A;
    --share1:#E8825A; --share2:#C96F4C; --share3:#A95E42; --share4:#7A4A36;
    --shadow:none;
  }
}
body{font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{padding:0 16px}
.card,.list{box-shadow:none;border:1px solid var(--line)}
.card{padding:18px 20px;margin-bottom:14px}
.list{margin-bottom:14px}
.item{border-bottom-color:var(--line2);padding:4px 4px 4px 16px;min-height:52px}
.item .kc,.pick .kc,.kv b,.sumline b,.hrow .bal,.stat div b{font-family:var(--f-num);font-weight:600}
.item .kc{font-size:1rem}
.item .del{color:var(--faint)}
.item .del svg{width:16px;height:16px}
.addrow{min-height:50px;padding:0 16px;border-top:1px dashed var(--line);color:var(--in);font-size:.9rem;gap:8px}
.addrow .p{background:none;width:18px;height:18px}
.addrow.ex{color:var(--accent)}
.empty{border-bottom:1px solid var(--line2)}

/* 見出し */
h2.sec{font-family:var(--f-head);font-weight:800;font-size:1.3rem;letter-spacing:.06em;color:var(--ink);margin:26px 4px 10px}
.sech h2.sec{margin:0}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:26px 4px 10px}
.sech .tot{font-size:.88rem;color:var(--sub)}
.sech .tot b{font-family:var(--f-num);font-weight:600;font-size:1.2rem;color:var(--ink);margin-right:3px}
.sbody h2.sec,.sec.small{font-family:inherit;font-size:.76rem;font-weight:700;letter-spacing:.1em;color:var(--sub);margin:16px 4px 6px}
.pagehead{padding:calc(env(safe-area-inset-top) + 22px) 4px 12px}
.pagehead small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.16em;color:var(--in)}
.pagehead h1{margin:2px 0 0;font-family:var(--f-head);font-weight:800;font-size:1.9rem;letter-spacing:.06em}

/* 上の帯 */
header.top{padding-top:calc(env(safe-area-inset-top) + 14px)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 2px 10px}
.brand .seal{width:28px;height:28px;border-radius:6px;background:var(--in);color:var(--card);display:grid;place-items:center;
  font-family:var(--f-head);font-weight:800;font-size:17px;line-height:1}
.brand .wm{font-family:var(--f-head);font-weight:800;font-size:1.06rem;letter-spacing:.08em}
.brand .chip:empty{display:none}
.brand .chip{margin-left:auto;font-size:.74rem;font-weight:700;color:var(--accent);background:var(--accent-w);padding:4px 11px;border-radius:99px}
.datebar{gap:12px;padding:0 0 12px}
.datebar .d{font-family:var(--f-head);font-weight:800;font-size:1.85rem;line-height:1.1;letter-spacing:.02em}
.datebar .d small{font-family:"Zen Kaku Gothic New",sans-serif;font-size:.74rem;letter-spacing:.1em;margin-top:3px}
.navbtn{width:44px;height:44px;box-shadow:none;border:1px solid var(--line);color:var(--ink)}

/* 収支カード */
.balance{text-align:left;padding:22px 22px 18px;display:grid;gap:16px}
.balance .bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.balance .lbl{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.12em;color:var(--sub)}
.balance .lbl2{font-size:.74rem;color:var(--sub)}
.balance .num{font-family:var(--f-num);font-weight:600;font-size:4.6rem;line-height:.95;letter-spacing:-.03em;margin-top:-6px}
.balance .num .u{font-family:"Zen Kaku Gothic New",sans-serif;font-size:1rem;font-weight:700;margin-left:8px;letter-spacing:0}
.balance .note{margin:-6px 0 0;font-size:.84rem;color:var(--sub)}
.meter{position:relative;height:12px;border-radius:99px;background:var(--line2)}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .35s ease}
.meter b{position:absolute;right:-1px;top:-5px;width:2px;height:22px;border-radius:2px;background:var(--ink)}
.goalbar{margin:-8px 0 0;padding:0;border:none;font-size:.82rem}
.goalbar b{font-size:.95rem}
.duo{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:16px}
.duo>div{display:grid;gap:6px}
.duo>div:first-child{padding-right:16px;border-right:1px solid var(--line)}
.duo>div:last-child{padding-left:16px}
.duo .cap{display:flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;letter-spacing:.08em;color:var(--sub)}
.duo .cap i{width:8px;height:8px;border-radius:50%}
.duo .v{font-family:var(--f-num);font-weight:600;font-size:1.75rem;line-height:1;font-variant-numeric:tabular-nums}
.duo .tr{height:5px;border-radius:99px;background:var(--line2);overflow:hidden}
.duo .tr i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.balance .fine{font-size:.7rem;color:var(--sub);line-height:1.6;margin:-4px 0 0}

/* 応援キャラ */
.cheer{background:none;box-shadow:none;padding:4px 4px 0;gap:10px;color:var(--ink);margin-bottom:14px}
.cheer .fig{width:88px}
.cheer .fig img{width:88px;height:88px}
.cheer .nm{font-size:.68rem;font-weight:700;letter-spacing:.1em;opacity:1;color:var(--sub)}
.cheer .say{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 4px;box-shadow:none;
  padding:12px 14px;font-size:.9rem;line-height:1.75;margin-bottom:22px}
.cheer .say::after{display:none}
.cheer .say b{color:var(--accent)}
/* きょうのひとこと */
.tip{padding:14px 18px 10px}
.tip .tk{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--sub);margin-bottom:6px}
.tip .tx{font-size:.95rem;line-height:1.75;color:var(--ink)}
.tip .tx b{color:var(--accent)}
.tip .nx{display:block;margin:6px 0 0 auto;min-height:40px;padding:0 4px;font-size:.8rem;font-weight:700;color:var(--accent)}

/* 体重 */
.wcard{display:flex;align-items:center;gap:14px;padding:16px 20px}
.wcard .wl{flex:1;min-width:0;display:grid;gap:2px}
.wrow .lb{font-size:.8rem;letter-spacing:.12em;color:var(--sub)}
.wrow{display:grid;gap:2px}
.wrow .in{display:flex;align-items:baseline;gap:4px}
.wrow input::-webkit-inner-spin-button,.wrow input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.wrow input{-moz-appearance:textfield;appearance:textfield;flex:none;width:4.4ch;text-align:left;font-family:var(--f-num);font-weight:600;font-size:2.5rem;line-height:1.05;padding:0}
.wrow .diff{font-size:.76rem;font-weight:700;color:var(--sub)}
.wrow .diff.dn{color:var(--minus)}
.spark{display:grid;justify-items:end;gap:4px;font-size:.7rem;color:var(--sub)}

/* 食事の枠 */
.share{display:flex;gap:3px;height:8px;margin:-2px 4px 14px}
.share i{border-radius:99px;min-width:4px}
.slot{margin-bottom:14px}
.slot .slot-head{padding:14px 16px 10px;gap:12px}
.slot-head .sic{width:36px;height:36px;border-radius:12px;background:var(--in-w);color:var(--in);display:grid;place-items:center;flex:none}
.slot-head .sic svg{width:20px;height:20px}
.slot-head .sw{width:8px;height:8px;border-radius:50%;flex:none;margin-left:-4px}
.slot-head .t{font-size:1rem}
.slot-head .k{font-size:.82rem}
.slot-head .k b{font-family:var(--f-num);font-weight:600;font-size:1rem;color:var(--ink);margin-right:3px}
.slot .item:first-of-type{border-top:1px solid var(--line2)}

/* 内訳 */
.stack{display:flex;gap:3px;height:14px;margin-bottom:14px}
.stack i{border-radius:4px;min-width:4px}
.stack i:first-child{border-radius:99px 4px 4px 99px}
.stack i:last-child{border-radius:4px 99px 99px 4px}
.kv{align-items:center;gap:10px;font-size:.9rem;padding:6px 0}
.kv .sq{width:10px;height:10px;border-radius:3px;flex:none}
.kv span:first-child{color:var(--ink)}
.kv .lab{flex:1}
.kv small{color:var(--sub);font-size:.76rem;margin-left:6px}
.kv.tot span:first-child{color:var(--sub);flex:none;white-space:nowrap}
.kv.tot b{text-align:right}

/* タブバー */
nav.tabs{background:color-mix(in srgb, var(--card) 92%, transparent);border-top-color:var(--line);padding:8px 8px env(safe-area-inset-bottom)}
nav.tabs button{padding:0 0 8px;gap:3px;font-size:.7rem;min-height:56px}
nav.tabs button .ic{width:56px;height:30px;border-radius:99px;display:grid;place-items:center}
nav.tabs button .ic svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on .ic{background:var(--accent-w)}

/* シート */
.mask{background:rgba(31,29,26,.45)}
.sheet{border-radius:28px 28px 0 0}
.sheet .grab{width:40px;height:5px;margin:10px auto 4px}
.sheet .sh{padding:8px 12px 12px 20px}
.sheet .sh .ti{font-family:var(--f-head);font-weight:800;font-size:1.3rem;letter-spacing:.04em}
.sheet .sh .cl{min-height:44px;padding:0 10px;color:var(--accent)}
.seg{margin:0 16px 14px;padding:4px;border-radius:14px}
.seg button{min-height:40px;border-radius:10px;font-size:.84rem;padding:0}
.seg button.on{box-shadow:0 1px 2px rgba(31,29,26,.12)}
.sbody{padding:0 16px 18px}
.srch{min-height:48px;border-radius:14px;padding:0 14px}
.pick{min-height:58px;border-bottom-color:var(--line2);gap:12px}
.pick .kc{color:var(--ink);font-size:1rem}
.pick .st{width:36px;height:36px;background:var(--in-w);color:var(--in);font-size:1.15rem;font-weight:700}
.qty{gap:6px}
.qty button{min-height:38px;padding:0;border-radius:99px;background:transparent;border:1px solid var(--line);color:var(--ink);font-family:var(--f-num);font-weight:600;font-size:.95rem}
.qty button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fld input,.fld select{min-height:48px;border-radius:12px}
.btn{min-height:52px;border-radius:99px;background:var(--in);color:var(--on-accent);font-weight:700}
.btn.sub{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--bg);color:var(--plus);border:1px solid var(--line)}
.step .no{width:24px;height:24px;left:-13px;background:var(--accent);color:var(--on-accent);font-family:var(--f-num);font-size:.8rem}
textarea.ta{border-radius:12px}
.toast{background:var(--ink);color:var(--bg)}

/* きろく */
.stat{gap:8px;text-align:left}
.stat>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column-reverse;gap:4px;justify-content:flex-end}
.stat div b{font-size:1.6rem;line-height:1.1}
.stat div span{font-size:.68rem;font-weight:700;line-height:1.45}
.stat-wrap{background:none;border:none;padding:0}
.hrow{min-height:58px;border-bottom-color:var(--line2);padding:8px 16px}
.hrow .bal{font-size:1.05rem}
.help{font-size:.82rem}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

/* ============================================================
   Dropbox 同期（スマホとPCで同じ記録を使う）
   - 記録は Dropbox の /カロリー帳/dietlog_sync.json に置く。
     obsidian-kit/import_diet.py は dietlog_*.json の一番新しいものを読むので、そのまま取りこめる
   - DB.mod に「どこを・いつ変えたか」を持つ。単位は 日ごとの食事と運動(d:日付)・体重(w:日付)・設定・定番
   - 読む → 単位ごとに新しいほうを残して合わせる → 変わっていれば書く。
     書くときは読んだ rev を渡し、先にほかの端末が書いていたら（409）読み直してやり直す
   - 消した記録も「消した時刻」が残るので、ほかの端末からよみがえらない
   - 認証は obsidian-memo と同じ PKCE＋更新トークン。同じ github.io の中なので、
     Obsidian メモでつないである端末なら、その接続を借りられる
   ============================================================ */
const SYNC_PATH="/カロリー帳/dietlog_sync.json";
function syncLS(k,v){
  try{
    const kk="dietlog."+k;
    if(v===undefined) return localStorage.getItem(kk);
    if(v===null) localStorage.removeItem(kk); else localStorage.setItem(kk,v);
  }catch(e){ return null; }
}
function syncOn(){ return !storageBlocked&&!!(syncLS("refresh")&&syncLS("appKey")); }
const syncState={busy:false,again:false,pending:false,timer:null,msg:"",err:false,at:0};

/* キーの順番をそろえた JSON（中身が同じかどうかを比べる用） */
function canon(v){
  return JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&!Array.isArray(x)
    ?Object.fromEntries(Object.keys(x).sort().map(a=>[a,x[a]])):x);
}
function unitsOf(db){
  const u=["profile","favFoods","favExs"];
  for(const k in db.days){ const d=db.days[k]; if(d.meals.length||d.exs.length) u.push("d:"+k); }
  for(const k in db.weights) u.push("w:"+k);
  return u;
}
function unitVal(db,u){
  if(u==="profile"||u==="favFoods"||u==="favExs") return db[u];
  const k=u.slice(2);
  if(u[0]==="d"){ const d=db.days[k]; return d&&(d.meals.length||d.exs.length)?d:undefined; }
  return db.weights[k];
}
function setUnit(db,u,v){
  if(u==="profile"||u==="favFoods"||u==="favExs"){ db[u]=structuredClone(v); return; }
  const box=u[0]==="d"?db.days:db.weights, k=u.slice(2);
  if(v===undefined) delete box[k]; else box[k]=structuredClone(v);
}
/* 前回保存したときから変わった単位に、いまの時刻をつける（save() から呼ぶ） */
function stampChanges(prev){
  if(!DB.mod) DB.mod={};
  const now=Date.now();
  for(const u of new Set([...unitsOf(DB),...unitsOf(prev)]))
    if(canon(unitVal(DB,u))!==canon(unitVal(prev,u))) DB.mod[u]=now;
}
/* 手もとと Dropbox を合わせる。単位ごとに、変えた時刻が新しいほうを残す */
function mergeDB(local,remote,first){
  const out=structuredClone(local); out.mod={...local.mod};
  const all=new Set([...unitsOf(local),...unitsOf(remote),...Object.keys(local.mod),...Object.keys(remote.mod)]);
  for(const u of all){
    const lt=local.mod[u]||0, rt=remote.mod[u]||0, lv=unitVal(local,u), rv=unitVal(remote,u);
    if(canon(lv)===canon(rv)){ if(rt>lt) out.mod[u]=rt; continue; }
    if(rt>lt){ setUnit(out,u,rv); out.mod[u]=rt; }
    else if(rt===lt) setUnit(out,u,unionUnit(u,lv,rv,first));
  }
  return out;
}
/* 変えた時刻が同じ（＝どちらも同期をはじめる前からの記録）ときは、消さずに両方を残す。
   ただしこの端末のはじめての同期（first）では、設定と定番は Dropbox 側に合わせる。
   新しい端末には最初から「おすすめの定番」が入っているので、そのまま足すと、ほかの端末で消した定番がよみがえる */
const SEED_NAMES=new Set(seed(structuredClone(DEFAULT)).favFoods.map(x=>x.name).concat(seed(structuredClone(DEFAULT)).favExs.map(x=>x.name)));
function unionUnit(u,lv,rv,first){
  if(lv===undefined) return rv;
  if(rv===undefined) return lv;
  if(first&&(u==="favFoods"||u==="favExs")){ const n=new Set(rv.map(x=>x.name)); return [...rv,...lv.filter(x=>!n.has(x.name)&&!SEED_NAMES.has(x.name))]; }
  if(first&&u==="profile") return rv;
  if(u[0]==="d"){
    const sig=x=>x.name+"|"+(x.kcal??"")+"|"+(x.slot??"")+"|"+(x.min??"");
    const add=(a,b)=>{ const ids=new Set(a.map(x=>x.id)), sigs=new Set(a.map(sig)); return [...a,...b.filter(x=>!ids.has(x.id)&&!sigs.has(sig(x)))]; };
    return {meals:add(lv.meals,rv.meals),exs:add(lv.exs,rv.exs)};
  }
  if(u==="favFoods"||u==="favExs"){ const n=new Set(lv.map(x=>x.name)); return [...lv,...rv.filter(x=>!n.has(x.name))]; }
  if(u==="profile") return lv.age==null||lv.height==null?rv:lv;   // 新しい端末（未設定）は、設定済みのほうに合わせる
  return lv;
}
function pruneDays(db){ for(const k in db.days){ const d=db.days[k]; if(!d.meals.length&&!d.exs.length) delete db.days[k]; } }
const sheetOpen=()=>sheet.classList.contains("on");
const typingInMain=()=>{ const a=document.activeElement; return !!a&&main.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName); };

function requestSync(ms){ clearTimeout(syncState.timer); syncState.timer=setTimeout(()=>syncNow(false),ms); }
async function syncNow(manual){
  if(!syncOn()) return;
  if(syncState.busy){ syncState.again=true; return; }
  // 入力の途中で画面を描き直さないよう、シートを閉じる・入力を終えるまで待つ
  if(sheetOpen()||typingInMain()){ syncState.pending=true; return; }
  syncState.busy=true; syncState.msg="同期しています…"; syncState.err=false; refreshSyncUI();
  try{
    for(let tries=0;;tries++){
      const r=await dropboxRead(SYNC_PATH);
      let remote=null;
      if(r){
        try{ remote=validateDB(JSON.parse(r.text)); }
        catch(e){ throw new Error("Dropboxの同期ファイルを読めません（"+e.message+"）。ファイルには手をつけていません"); }
      }
      if(sheetOpen()||typingInMain()){ syncState.pending=true; break; }   // 読んでいるあいだに入力がはじまった
      pruneDays(DB);
      const merged=remote?mergeDB(DB,remote,!syncLS("at")):structuredClone(DB);
      const gotNew=canon({...merged,mod:0})!==canon({...DB,mod:0});
      // 比べる・書き出すのは描き直す前に（描き直すと、表示中の日の空の記録ができるため）
      const needPush=!remote||canon(merged)!==canon(remote), text=JSON.stringify(merged,null,1);
      if(canon(merged)!==canon(DB)) applyMerged(merged);
      if(needPush){
        try{ await dropboxWrite(SYNC_PATH,text,r?r.rev:null); }
        catch(e){ if(e.conflict&&tries<3) continue; throw e; }
      }
      syncState.at=Date.now(); syncLS("at",String(syncState.at)); syncState.msg="";
      if(gotNew) toast("ほかの端末の記録を取りこみました");
      else if(manual) toast("同期しました");
      break;
    }
  }catch(e){
    syncState.err=true; syncState.msg=String(e.message||e).slice(0,200);
    if(manual) toast("同期できませんでした");
  }finally{
    syncState.busy=false; refreshSyncUI();
    if(syncState.again){ syncState.again=false; requestSync(300); }
  }
}
/* 合わせた結果を手もとに保存する（時刻はつけ直さない） */
function applyMerged(m){
  localStorage.setItem(KEY,JSON.stringify(m));
  DB=m; persisted=JSON.stringify(DB); lastSaved=JSON.parse(persisted);
  render();
}

/* ---- Dropbox の認証（obsidian-memo と同じ作り） ---- */
const redirectUri=()=>location.origin+location.pathname.replace(/index\.html$/,"");
function b64url(bytes){ let s=""; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function challengeOf(v){ return b64url(new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)))); }
let dbxToken=null, dbxExp=0;
async function token(){
  if(dbxToken&&Date.now()<dbxExp-60000) return dbxToken;
  const refresh=syncLS("refresh"), key=syncLS("appKey");
  if(!refresh||!key) throw new Error("Dropboxにつながっていません");
  const res=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",
    body:new URLSearchParams({grant_type:"refresh_token",refresh_token:refresh,client_id:key})});
  if(!res.ok){
    if(res.status===400){ syncLS("refresh",null); throw new Error("つなぎ直しが必要です（設定から、もう一度つないでください）"); }
    throw new Error("Dropboxの認証に失敗しました（"+res.status+"）");
  }
  const j=await res.json(); dbxToken=j.access_token; dbxExp=Date.now()+(j.expires_in||14400)*1000;
  return dbxToken;
}
async function startAuth(){
  const key=(document.getElementById("dbxKey")?.value||"").trim();
  if(!/^[a-z0-9]{8,32}$/i.test(key)){ toast("App key を貼ってください"); return; }
  if(!crypto.subtle){ toast("https のページで開いてください"); return; }
  syncLS("appKey",key);
  const a=new Uint8Array(48); crypto.getRandomValues(a); const verifier=b64url(a);
  sessionStorage.setItem("dietlog.verifier",verifier);
  const u=new URL("https://www.dropbox.com/oauth2/authorize");
  u.searchParams.set("client_id",key); u.searchParams.set("response_type","code");
  u.searchParams.set("code_challenge",await challengeOf(verifier)); u.searchParams.set("code_challenge_method","S256");
  u.searchParams.set("token_access_type","offline"); u.searchParams.set("scope","files.content.read files.content.write");
  u.searchParams.set("redirect_uri",redirectUri());
  location.href=u.toString();
}
/* Dropbox から ?code=… で戻ってきたときの受け取り。つながったら true */
async function finishAuth(){
  const p=new URLSearchParams(location.search);
  if(!p.get("code")&&!p.get("error")) return false;
  history.replaceState(null,"",redirectUri());
  if(p.get("error")){ toast("つなげませんでした："+(p.get("error_description")||p.get("error"))); return false; }
  const verifier=sessionStorage.getItem("dietlog.verifier"); sessionStorage.removeItem("dietlog.verifier");
  if(!verifier){ toast("もう一度「つなぐ」からやり直してください"); return false; }
  const res=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",body:new URLSearchParams({
    grant_type:"authorization_code",code:p.get("code"),code_verifier:verifier,client_id:syncLS("appKey")||"",redirect_uri:redirectUri()})});
  if(!res.ok){ toast("つなげませんでした（"+res.status+"）"); return false; }
  const j=await res.json();
  if(!j.refresh_token){ toast("つなげませんでした。App key を確かめてください"); return false; }
  syncLS("refresh",j.refresh_token); dbxToken=j.access_token; dbxExp=Date.now()+(j.expires_in||14400)*1000;
  return true;
}
/* 同じ github.io の Obsidian メモでつないであれば、その接続を借りる */
function obsmemoLink(){
  try{ const k=localStorage.getItem("obsmemo.appKey"), r=localStorage.getItem("obsmemo.refresh"); return k&&r?{k,r}:null; }catch(e){ return null; }
}
function useObsmemo(){
  const o=obsmemoLink(); if(!o) return;
  syncLS("appKey",o.k); syncLS("refresh",o.r); dbxToken=null;
  refreshSyncUI(); syncNow(true);
}
function unlinkSync(){
  if(!confirm("この端末の同期をやめます。記録はこの端末とDropboxの両方に残ります。よろしいですか？")) return;
  syncLS("refresh",null); syncLS("at",null); dbxToken=null; syncState.msg=""; syncState.err=false;
  refreshSyncUI(); toast("同期をやめました");
}

/* ---- Dropbox のファイル操作 ---- */
// Dropbox-API-Arg は HTTP ヘッダなので、日本語は \uXXXX に逃がす
const apiArg=o=>JSON.stringify(o).replace(/[\u007f-￿]/g,c=>"\\u"+c.charCodeAt(0).toString(16).padStart(4,"0"));
async function dropboxRead(path){
  const res=await fetch("https://content.dropboxapi.com/2/files/download",{method:"POST",
    headers:{Authorization:"Bearer "+await token(),"Dropbox-API-Arg":apiArg({path})}});
  if(res.status===409){ const t=await res.text(); if(t.includes("not_found")) return null; throw new Error("Dropboxから読めません："+t.slice(0,120)); }
  if(!res.ok) throw new Error("Dropboxから読めません（"+res.status+"）");
  let rev=null;
  try{ rev=JSON.parse(res.headers.get("dropbox-api-result")||"{}").rev||null; }catch(e){}
  const text=await res.text();
  if(!rev){   // ヘッダが読めない環境向けの保険
    const m=await fetch("https://api.dropboxapi.com/2/files/get_metadata",{method:"POST",
      headers:{Authorization:"Bearer "+await token(),"Content-Type":"application/json"},body:JSON.stringify({path})});
    if(m.ok) rev=(await m.json()).rev||null;
  }
  return {text,rev};
}
async function dropboxWrite(path,text,rev){
  const arg={path,autorename:false,mute:true,mode:rev?{".tag":"update",update:rev}:"add"};
  const res=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",
    headers:{Authorization:"Bearer "+await token(),"Dropbox-API-Arg":apiArg(arg),"Content-Type":"application/octet-stream"},
    body:new Blob([text],{type:"application/octet-stream"})});
  if(res.ok) return;
  const t=await res.text(), err=new Error("Dropboxに書けません："+t.slice(0,120));
  err.conflict=res.status===409&&t.includes("conflict");   // ほかの端末が先に書いた
  throw err;
}

/* Shared validation for existing v1 data and imported backups. */
function validDate(k){return /^\d{4}-\d{2}-\d{2}$/.test(k)&&keyOf(dateOf(k))===k;}
function validNumber(v,min,max){return typeof v==="number"&&Number.isFinite(v)&&v>=min&&v<=max;}
function validateProfile(p){
  if(!["male","female"].includes(p.sex)||!validNumber(p.activity,1,3)||!validNumber(p.deficit,0,5000)) throw new Error("活動量・目標の数値を確認してください");
  if(p.age!==null&&!validNumber(p.age,1,120)) throw new Error("年齢は1〜120で入力してください");
  if(p.height!==null&&!validNumber(p.height,50,250)) throw new Error("身長は50〜250cmで入力してください");
  if(p.goalWeight!==null&&!validNumber(p.goalWeight,1,500)) throw new Error("目標体重は1〜500kgで入力してください");
  // 応援モードは見た目の設定なので、おかしな値でも弾かずに既定へ寄せる
  p.cheer = p.cheer!==false;
  p.tips = p.tips!==false;
  p.charaName = (typeof p.charaName==="string"&&p.charaName.trim()) ? p.charaName.trim().slice(0,12) : "カロン";
}
function validateDB(src){
  const object=v=>v&&typeof v==="object"&&!Array.isArray(v);
  const fail=()=>{throw new Error("バックアップの形式または数値が不正です");};
  if(!object(src)||src.version!==1||!object(src.days)||!object(src.weights)||!object(src.profile)) fail();
  const d=structuredClone(DEFAULT);
  for(const k of Object.keys(d.profile)) if(Object.hasOwn(src.profile,k)) d.profile[k]=src.profile[k];
  validateProfile(d.profile);
  const row=(r,kind)=>{
    if(!object(r)||typeof r.name!=="string"||!r.name.trim()||r.name.length>300) fail();
    // id は同期で同じ記録を見分けるのに使うので、正しい形ならそのまま残す
    const out={id:typeof r.id==="string"&&/^[\w-]{1,40}$/.test(r.id)?r.id:uid(),name:r.name.trim()};
    if(kind==="meal"||kind==="food"){
      if(!validNumber(r.kcal,0,50000)) fail();out.kcal=r.kcal;
      if(kind==="meal"){
        if(!SLOTS.some(s=>s[0]===r.slot)||!validNumber(r.q??1,0.01,100)) fail();
        out.slot=r.slot;out.q=r.q??1;
      }else out.slot=SLOTS.some(s=>s[0]===r.slot)?r.slot:null;
    }else{
      if(!validNumber(r.mets,1,30)||!validNumber(r.min,1,1440)) fail();
      out.mets=r.mets;out.min=r.min;
      if(kind==="exercise"){if(!validNumber(r.kcal,0,100000)) fail();out.kcal=r.kcal;}
    }
    return out;
  };
  for(const [k,v] of Object.entries(src.weights)){
    if(!validDate(k)||!validNumber(v,0.1,500)) fail();d.weights[k]=v;
  }
  for(const [k,v] of Object.entries(src.days)){
    if(!validDate(k)||!object(v)||!Array.isArray(v.meals)||!Array.isArray(v.exs)) fail();
    d.days[k]={meals:v.meals.map(x=>row(x,"meal")),exs:v.exs.map(x=>row(x,"exercise"))};
  }
  if(!Array.isArray(src.favFoods)||!Array.isArray(src.favExs)) fail();
  d.favFoods=src.favFoods.map(x=>row(x,"food"));d.favExs=src.favExs.map(x=>row(x,"ex"));
  if(object(src.mod)) for(const [u,t] of Object.entries(src.mod))
    if(/^(profile|favFoods|favExs|[dw]:\d{4}-\d{2}-\d{2})$/.test(u)&&validNumber(t,0,1e14)) d.mod[u]=t;
  return d;
}

function editEntry(kind,id){
  const r=day(cur)[kind].find(x=>x.id===id);if(!r)return;
  sheetState={kind:"edit",type:kind,id,date:cur};openSheet("記録を編集");shSeg.innerHTML="";
  shBody.innerHTML=`<div class="fld"><label for="editName">名前</label><input id="editName" maxlength="300" value="${esc(r.name)}"></div>`+
    (kind==="meals"?`<div class="fld"><label for="editKcal">食べた量の合計 (kcal)</label><input id="editKcal" type="number" inputmode="numeric" min="0" max="50000" value="${r.kcal}"></div>
      <div class="fld"><label for="editSlot">食事の区分</label><select id="editSlot">${SLOTS.map(s=>`<option value="${s[0]}" ${s[0]===r.slot?"selected":""}>${s[1]}</option>`).join("")}</select></div>`:
      `<div class="fld"><label for="editMin">時間（分）</label><input id="editMin" type="number" min="1" max="1440" value="${r.min}"></div>
      <div class="fld"><label for="editMets">強さ METs</label><input id="editMets" type="number" step="0.1" min="1" max="30" value="${r.mets}"></div>`)+
    `<button class="btn" onclick="saveEntry()">変更を保存</button>`;
}
function saveEntry(){
  const st=sheetState,r=day(st.date)[st.type].find(x=>x.id===st.id);
  const name=document.getElementById("editName").value.trim();
  if(!name){toast("名前を入れてください");return;}
  let updates={name};
  if(st.type==="meals"){
    const el=document.getElementById("editKcal"),k=Number(el.value);
    if(!el.value||!validNumber(k,0,50000)){toast("カロリーは0〜50000で入力してください");return;}
    updates={...updates,kcal:Math.round(k),q:1,slot:document.getElementById("editSlot").value};
  }else{
    const min=Number(document.getElementById("editMin").value),mets=Number(document.getElementById("editMets").value);
    if(!validNumber(min,1,1440)||!validNumber(mets,1,30)){toast("時間は1〜1440分、METsは1〜30で入力してください");return;}
    updates={...updates,min,mets,kcal:exKcal(mets,min,st.date)};
  }
  Object.assign(r,updates);if(!save())return;closeSheet();render();toast("変更しました");
}
function removeEntry(kind,id){
  const k=cur,a=day(k)[kind],i=a.findIndex(x=>x.id===id);if(i<0)return;
  const [row]=a.splice(i,1);if(!save()){render();return;}render();toast("削除しました");
  const btn=document.createElement("button");btn.textContent="元に戻す";
  btn.onclick=()=>{
    day(k)[kind].splice(Math.min(i,day(k)[kind].length),0,row);
    if(save()){render();toast("元に戻しました");}
  };
  document.getElementById("toast").appendChild(btn);
  clearTimeout(toastT);toastT=setTimeout(()=>document.getElementById("toast").classList.remove("on"),8000);
}

/* ---- 日付まわり ---- */
function todayKey(){ return keyOf(new Date()); }
function keyOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dateOf(k){ const[a,b,c]=k.split("-").map(Number); return new Date(a,b-1,c); }
function shiftDay(k,n){ const d=dateOf(k); d.setDate(d.getDate()+n); return keyOf(d); }
function labelOf(k){
  const d=dateOf(k), w="日月火水木金土"[d.getDay()];
  return (d.getMonth()+1)+"月"+d.getDate()+"日（"+w+"）";
}
function day(k){
  if(!DB.days[k]) DB.days[k]={meals:[],exs:[]};
  const d=DB.days[k];
  if(!d.meals) d.meals=[]; if(!d.exs) d.exs=[];
  return d;
}

/* ---- 体重 ---- */
function weightAt(k){
  // その日の体重。なければ直近の過去の記録をさかのぼって使う
  const keys=Object.keys(DB.weights).sort();
  let w=null;
  for(const kk of keys){ if(kk<=k) w=DB.weights[kk]; }

  return w;
}

/* ---- カロリー計算 ---- */
function bmrOf(k){
  // Mifflin-St Jeor 式
  const p=DB.profile, w=weightAt(k);
  if(!w||!p.height||!p.age) return null;
  const base=10*w+6.25*p.height-5*p.age;
  return Math.round(p.sex==="female" ? base-161 : base+5);
}
function lifeOf(k){
  // 生活の活動でふえる分（基礎代謝×活動係数 − 基礎代謝）
  const b=bmrOf(k); if(b==null) return null;
  return Math.round(b*(DB.profile.activity-1));
}
function exKcal(mets,min,k){
  // 運動でふえた分。基礎代謝ぶん（1METs）は別に数えているので引く
  const w=weightAt(k); if(!w) return 0;
  return Math.round((mets-1)*1.05*w*(min/60));
}
function totals(k){
  const d=day(k);
  const inK=d.meals.reduce((s,m)=>s+m.kcal,0);
  const exK=d.exs.reduce((s,e)=>s+exKcal(e.mets,e.min,k),0);
  const b=bmrOf(k), l=lifeOf(k);
  const outK=(b==null)?exK:(b+l+exK);
  return {inK,exK,bmr:b,life:l,outK,bal:inK-outK,ready:b!=null};
}

/* ============================================================
   応援モード（キャラの表情とひとこと）
   ============================================================ */
const CHEER={
  hello:{
    morning:["おはよう！今日も記録からはじめよっか","朝ごはん、食べた？忘れないうちに入れとこ"],
    day:["お昼だね。午前に食べたもの、入れちゃお？","今日のぶん、まだ空っぽだよ"],
    night:["今日のぶん、まだ入ってないよ。思い出せるところからでいいよ","寝る前に、今日食べたものを入れちゃお？"]
  },
  cheer:["いい調子！あと{rest}kcalで今日の目標だよ","あとちょっと。ひと歩きしてくる？","もう少しでとどくよ。がんばれー！","あと{rest}kcal。いけるいける！"],
  joy:["今日の目標クリア！えらい！","やったー！この調子でいこ！","きっちり達成だね。ちゃんと続いてるよ","今日もよくがんばりました！"],
  gentle:["今日はちょっと多めだったね。でも記録できたのがえらいよ","1日くらい平気だよ。明日またいっしょにやろ？","食べすぎる日があるのがふつうだよ。気にしすぎないでね","数字より、続いてることのほうが大事だからね"],
  worry:["今日は食べる量が少なすぎるみたい。基礎代謝のぶんは食べたほうが、かえってやせやすいよ","がんばりすぎてない？ちゃんと食べるのも大事な練習だよ","減らしすぎるとリバウンドしやすいんだって。無理しないでね"]
};
function hashOf(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
/* その日が目標達成だった連続日数（記録のない日でとぎれる） */
function achieveStreak(k){
  let n=0,c=k;
  for(let i=0;i<400;i++){
    const d=DB.days[c];
    if(!d||(!d.meals.length&&!d.exs.length)) break;
    const t=totals(c);
    if(!t.ready||t.bal>-DB.profile.deficit) break;
    n++; c=shiftDay(c,-1);
  }
  return n;
}
/* いまの状況に合う表情とひとことを選ぶ */
function cheerOf(k){
  const p=DB.profile, t=totals(k), d=DB.days[k];
  const has=d&&(d.meals.length||d.exs.length);
  const pick=(a,salt)=>a[hashOf(k+salt)%a.length];
  if(!t.ready) return {exp:"smile",text:"はじめまして、"+(p.charaName||"カロン")+"だよ。設定で身長と体重を入れたら、いっしょにはじめよう！"};
  if(!has){
    const h=new Date().getHours();
    const part=(k===todayKey())?(h<11?"morning":h<17?"day":"night"):"day";
    return {exp:"smile",text:pick(CHEER.hello[part],"h")};
  }
  const w=DB.weights[k], pw=prevWeight(k);
  if(w!=null&&pw&&w<pw.w-0.05){
    if(p.goalWeight&&w<=p.goalWeight) return {exp:"joy",text:"目標体重にとどいたよ！本当におつかれさま！"};
    return {exp:"joy",text:(Math.round((pw.w-w)*10)/10)+"kg 減ってるよ。がんばったね！"};
  }
  // 食べなさすぎは、ほめずに止める
  if(t.inK>0&&(t.inK<t.bmr-150||t.bal<=-(p.deficit+800))) return {exp:"worry",text:pick(CHEER.worry,"w")};
  if(t.bal<=-p.deficit){
    const st=achieveStreak(k);
    if([3,5,7,10,14,20,30,50,100].indexOf(st)>=0) return {exp:"joy",text:st+"日つづけて達成だよ。すごい！"};
    return {exp:"joy",text:pick(CHEER.joy,"j")};
  }
  if(t.bal<0) return {exp:"cheer",text:pick(CHEER.cheer,"c").replace("{rest}",t.bal+p.deficit)};
  return {exp:"gentle",text:pick(CHEER.gentle,"g")};
}
/* ============================================================
   きょうのひとこと（まめ知識・小さなコツ・はげまし）
   日付で1つ決まり、「つぎのひとこと」で順にめくれる。
   その日の様子（食べすぎ・減らしすぎ・体重が増えた など）に合うものを最初に出す。
   数字は目安として一般に言われている範囲にとどめ、言い切りすぎないこと
   ============================================================ */

const TIP_KIND={know:"💡 まめ知識",tip:"👟 小さなコツ",heart:"🌱 ひとこと"};
/* 3種類を交互にならべた一覧（めくったときに同じ種類が続かないように） */
const TIP_ALL=(()=>{ const a=[],n=Math.max(...Object.values(TIPS).map(x=>x.length));
  for(let i=0;i<n;i++) for(const k of ["know","heart","tip"]) if(TIPS[k][i]) a.push([k,TIPS[k][i]]);
  return a; })();
/* その日の様子に合うもの（なければ null） */
const TIP_FOR={
  gentle:[["heart",1],["heart",8],["heart",2],["heart",9]],
  worry:[["know",16],["know",8],["heart",15]],
  weightUp:[["know",1],["know",2],["know",15]],
  empty:[["heart",0],["heart",5],["tip",8]]
};
let tipTurn={k:null,n:0};
function tipOf(k){
  const t=totals(k), d=DB.days[k], has=d&&(d.meals.length||d.exs.length);
  const seed=hashOf(k+"tip");
  if(tipTurn.k!==k) tipTurn={k,n:0};
  let sit=null;
  if(t.ready&&has){
    const p=DB.profile, w=DB.weights[k], pw=prevWeight(k);
    if(t.inK>0&&(t.inK<t.bmr-150||t.bal<=-(p.deficit+800))) sit="worry";
    else if(w!=null&&pw&&w>pw.w+0.05) sit="weightUp";
    else if(t.bal>0) sit="gentle";
  }else if(!has) sit="empty";
  if(tipTurn.n===0&&sit){
    const c=TIP_FOR[sit][seed%TIP_FOR[sit].length];
    return [c[0],TIPS[c[0]][c[1]]];
  }
  return TIP_ALL[(seed+tipTurn.n)%TIP_ALL.length];
}
function tipHTML(k){
  if(DB.profile.tips===false) return "";
  const [kind,text]=tipOf(k);
  // TIPS の文はアプリ内の固定文なので、<b> をそのまま使う
  return `<section class="card tip" aria-label="きょうのひとこと" aria-live="polite">
    <div class="tk">${TIP_KIND[kind]}</div><div class="tx">${text}</div>
    <button class="nx" onclick="nextTip()">つぎのひとこと →</button></section>`;
}
function nextTip(){
  tipTurn.n++;
  const el=document.querySelector(".tip");
  if(!el){ render(); return; }
  const [kind,text]=tipOf(cur);
  el.querySelector(".tk").textContent=TIP_KIND[kind];
  el.querySelector(".tx").innerHTML=text;
}

const main=document.getElementById("main");

function render(){
  document.getElementById("nextD").disabled=cur>=todayKey();
  const nDays=allKeys().length; document.getElementById("dayCount").textContent=nDays?"記録 "+nDays+"日":"";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  document.getElementById("top").classList.toggle("hide", tab!=="today");
  if(tab==="today"){ dLabel.innerHTML=labelOf(cur)+(cur===todayKey()?'<small>きょう · 日付を選択</small>':'<small>日付を選択 · きょうへ戻る</small>'); renderToday(); }
  else if(tab==="hist") renderHist();
  else if(tab==="fav") renderFav();
  else renderSet();
}

/* ---------- ① きょう ---------- */
function renderToday(){
  const t=totals(cur), d=day(cur), p=DB.profile;
  let h="";

  /* 収支カード */
  // 減らしすぎ（月4kg＝週1kgを超えるペース）は「達成」扱いにせず、注意の色にする
  const tooMuch = t.ready && d.meals.length && t.bal<=-p.deficit && Math.abs(t.bal)*30/7200>4;
  const balColor = !d.meals.length ? "var(--sub)" : tooMuch ? "var(--plus)" : (t.bal<=0 ? "var(--minus)" : "var(--plus)");
  const maxK=Math.max(t.inK,t.outK,1);
  if(!t.ready){
    h+=`<div class="card balance">
      <div class="lbl">年齢・身長と体重を入れると収支が出ます</div>
      <div style="font-size:1rem;margin:8px 0 12px;color:var(--sub)">基礎代謝がわかると<br>1日の収支が出せます</div>
      <button class="btn" onclick="go('set')">設定を開く</button>
    </div>`;
  }else{
    const prog = !d.meals.length||t.bal>=0 ? 0 : Math.min(1, -t.bal/Math.max(1,p.deficit));
    h+=`<section class="card balance" aria-label="収支">
      <div class="bhead"><span class="lbl">${cur===todayKey()?"きょう":"この日"}の収支</span><span class="lbl2">記録した摂取 − 推定消費</span></div>
      <div class="num" style="color:${balColor}">${d.meals.length?(t.bal>0?"+":t.bal<0?"−":"")+Math.abs(t.bal).toLocaleString():"—"}<span class="u">kcal</span></div>
      <div class="note">${d.meals.length?balNote(t.bal,p.deficit):"食事を記録すると収支の目安が出ます"}</div>
      <div class="meter" aria-hidden="true"><i style="width:${prog*100}%;background:${balColor}"></i><b></b></div>
      <div class="goalbar">
        <span>${!d.meals.length?"食事は未記録":
          tooMuch?'<b style="color:var(--plus)">減らしすぎ</b>':
          t.bal<=-p.deficit?'<b style="color:var(--minus)">目標達成 ✓</b>':
          'あと <b>'+(t.bal+p.deficit)+'</b> kcal で目標'}</span>
        <span>目標 −${p.deficit} / 日</span>
      </div>
      <div class="duo">
        <div><span class="cap"><i style="background:var(--in)"></i>食べた</span><span class="v">${t.inK.toLocaleString()}</span><span class="tr"><i style="width:${t.inK/maxK*100}%;background:var(--in)"></i></span></div>
        <div><span class="cap"><i style="background:var(--out)"></i>使った（推定）</span><span class="v">${t.outK.toLocaleString()}</span><span class="tr"><i style="width:${t.outK/maxK*100}%;background:var(--out)"></i></span></div>
      </div>
      <p class="fine">食事の入力途中は暫定値です。消費カロリーは推定です。</p>
    </section>`;
  }

  /* 応援キャラ */
  h+=cheerHTML(cur);
  h+=tipHTML(cur);

  /* 体重 */
  const wv=DB.weights[cur], prev=prevWeight(cur);
  let diff="";
  let dn=false;
  if(wv!=null&&prev!=null){ const dv=+(wv-prev.w).toFixed(1); dn=dv<0; diff=(dv>0?"+":dv<0?"−":"±")+Math.abs(dv)+" kg（"+labelShort(prev.k)+"比）"; }
  else if(wv==null){ const lw=weightAt(cur); if(lw) diff="前回 "+lw+"kg"; }
  h+=`<section class="card wcard" aria-label="体重"><div class="wl wrow">
      <label class="lb" for="wIn">体重</label>
      <span class="in"><input id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="—" value="${wv!=null?wv:""}"><span class="u">kg</span></span>
      ${diff?`<span class="diff${dn?" dn":""}">${diff}</span>`:""}
    </div>${weightSpark(cur)}</section>`;

  /* 食事 */
  h+=`<div class="sech"><h2 class="sec">食べたもの</h2><span class="tot"><b>${t.inK.toLocaleString()}</b>kcal</span></div>`;
  const sums=SLOTS.map(([sid])=>d.meals.filter(m=>m.slot===sid).reduce((s,m)=>s+m.kcal,0));
  if(t.inK>0) h+=`<div class="share" aria-hidden="true">${sums.map((v,i)=>v>0?`<i style="flex:${v};background:var(--share${i+1})"></i>`:"").join("")}</div>`;
  else h+=`<p class="help" style="margin:-4px 4px 12px">記録した名前をタップすると編集できます</p>`;
  SLOTS.forEach(([sid,sname],si)=>{
    const items=d.meals.filter(m=>m.slot===sid);
    const sum=sums[si];
    h+=`<section class="slot list" aria-label="${sname}"><div class="slot-head"><span class="sic">${svgI(ICON[sid])}</span><span class="t">${sname}</span><span class="k">${sum?`<b>${sum}</b>kcal`:""}</span></div><div>`;
    for(const m of items){
      h+=`<div class="item"><button class="nm" onclick="editEntry('meals','${m.id}')" aria-label="${esc(m.name)}を編集">${esc(m.name)}${m.q&&m.q!==1?`<em>×${m.q}</em>`:""}</button>
        <span class="kc">${m.kcal}</span><button class="del" aria-label="${esc(m.name)}を削除" onclick="delMeal('${m.id}')">${X_SVG}</button></div>`;
    }
    h+=`<button class="addrow" onclick="openFood('${sid}')"><span class="p">${PLUS_SVG}</span>${sname}を追加</button></div></section>`;
  });

  /* 運動 */
  h+=`<div class="sech"><h2 class="sec">運動</h2><span class="tot"><b>${t.exK}</b>kcal</span></div><div class="list">`;
  for(const e of d.exs){
    h+=`<div class="item"><button class="nm" onclick="editEntry('exs','${e.id}')" aria-label="${esc(e.name)}を編集">${esc(e.name)}<em>${e.min}分</em></button>
      <span class="kc">${exKcal(e.mets,e.min,cur)}</span><button class="del" aria-label="${esc(e.name)}を削除" onclick="delEx('${e.id}')">${X_SVG}</button></div>`;
  }
  h+=`<button class="addrow ex" onclick="openEx()"><span class="p">${PLUS_SVG}</span>運動を追加</button></div>`;

  /* 消費の内訳 */
  if(t.ready){
    h+=`<div class="sech"><h2 class="sec">使った分の内訳</h2><span class="tot"><b>${t.outK.toLocaleString()}</b>kcal</span></div><div class="card">
      <div class="stack" aria-hidden="true"><i style="flex:${t.bmr};background:var(--out)"></i><i style="flex:${Math.max(t.life,1)};background:var(--out2)"></i>${t.exK?`<i style="flex:${t.exK};background:var(--out3)"></i>`:""}</div>
      <div class="kv"><i class="sq" style="background:var(--out)"></i><span class="lab">基礎代謝<small>寝ていても使う分</small></span><b>${t.bmr.toLocaleString()}</b></div>
      <div class="kv"><i class="sq" style="background:var(--out2)"></i><span class="lab">生活の活動<small>×${DB.profile.activity.toFixed(2)}</small></span><b>${t.life.toLocaleString()}</b></div>
      <div class="kv"><i class="sq" style="background:var(--out3)"></i><span class="lab">運動</span><b>${t.exK}</b></div>
    </div>`;
  }
  h+=`<div style="height:10px"></div>`;
  main.innerHTML=h;

  const wIn=document.getElementById("wIn");
  wIn.addEventListener("change",()=>{
    const v=parseFloat(wIn.value);
    if(!wIn.value.trim()) delete DB.weights[cur];
    else if(!Number.isFinite(v)||v<=0||v>500){toast("体重は0より大きく500kg以下で入力してください");render();return;}
    else DB.weights[cur]=Math.round(v*10)/10;
    save(); render();
  });
}
function weightSpark(k){
  const ks=Object.keys(DB.weights).filter(x=>x<=k).sort().slice(-7);
  if(ks.length<2) return "";
  const vs=ks.map(x=>DB.weights[x]);
  const lo=Math.min(...vs), hi=Math.max(...vs), r=Math.max(hi-lo,0.4);
  const pts=vs.map((v,i)=>[2+i*96/(vs.length-1), 4+(hi-v)/r*28]);
  const last=pts[pts.length-1];
  return `<div class="spark" aria-hidden="true"><svg width="104" height="40" viewBox="0 0 104 40" fill="none">
    <polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" stroke="var(--out3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="var(--out)"/></svg><span>最近${ks.length}回</span></div>`;
}
function balNote(bal,goal){
  if(bal<=-goal){
    const per=Math.abs(bal)*30/7200;   // 脂肪1kg ≒ 7200kcal
    // 月4kg（週1kg）を超えるペースは、体をこわしやすいのでほめない
    if(per>4) return "減らしすぎかも。このままだと 約"+per.toFixed(1)+"kg／月 で、体に無理がかかります";
    return "目標クリア。このペースなら 約"+per.toFixed(1)+"kg／月 減ります";
  }
  if(bal<0) return "マイナスです。もう少しで目標";
  if(bal===0) return "ちょうどトントンです";
  return "オーバーしています";
}
function prevWeight(k){
  const keys=Object.keys(DB.weights).filter(x=>x<k).sort();
  if(!keys.length) return null;
  const kk=keys[keys.length-1];
  return {k:kk,w:DB.weights[kk]};
}
function labelShort(k){ const d=dateOf(k); return (d.getMonth()+1)+"/"+d.getDate(); }

/* ---------- ② きろく（履歴） ---------- */
function renderHist(){
  const keys=allKeys();
  let h=`<header class="pagehead"><small>RECORD</small><h1>きろく</h1></header>`;

  /* まとめ */
  const last7=keys.filter(k=>k>=shiftDay(todayKey(),-6)&&k<=todayKey()&&day(k).meals.length);
  const bals=last7.map(k=>totals(k)).filter(t=>t.ready);
  const avg=bals.length?Math.round(bals.reduce((s,t)=>s+t.bal,0)/bals.length):null;
  const ws=Object.keys(DB.weights).sort();
  const w0=ws.length?DB.weights[ws[0]]:null, w1=ws.length?DB.weights[ws[ws.length-1]]:null;
  h+=`<div class="stat" style="margin-bottom:12px">
     <div><b style="color:${avg!=null&&avg<=0?'var(--minus)':'var(--plus)'}">${avg!=null?(avg>0?"+":"")+avg:"—"}</b><span>7日の平均収支（${bals.length}日分）</span></div>
     <div><b>${w1!=null?w1:"—"}</b><span>いまの体重（kg）</span></div>

   </div>`;

  h+=`<p class="help" style="margin:0 4px 12px">食事が未記録の日は平均から除外します。入力途中の日は含まれます。</p>`;

  h+=`<h2 class="sec">1日の収支（直近14日）</h2><div class="card">${balChart(keys.filter(k=>k>=shiftDay(todayKey(),-13)&&k<=todayKey()&&day(k).meals.length))}</div>`;

  h+=`<h2 class="sec">日ごとの記録</h2><div class="list">`;
  if(!keys.length) h+=`<div class="empty">まだ記録がありません</div>`;

  for(const k of rev){
    const t=totals(k), w=DB.weights[k];
    const mx=Math.max(t.inK,t.outK,1);
    h+=`<button class="hrow" style="width:100%;text-align:left" onclick="go('today','${k}')">
      <span class="dd">${labelShort(k)}<br>${"日月火水木金土"[dateOf(k).getDay()]}${w?" "+w+"kg":""}</span>

        <span style="display:block;height:7px;border-radius:99px;background:var(--in);width:${t.inK/mx*100}%;min-width:2px;margin-bottom:3px"></span>
        <span style="display:block;height:7px;border-radius:99px;background:var(--out);width:${t.outK/mx*100}%;min-width:2px"></span>
      </span>
      <span class="bal" style="color:${t.bal<=0?'var(--minus)':'var(--plus)'}">${t.ready&&day(k).meals.length?(t.bal>0?"+":"")+t.bal:"—"}</span>
    </button>`;
  }
  h+=`</div><div style="height:10px"></div>`;

}
function allKeys(){
  const s=new Set([...Object.keys(DB.days).filter(k=>day(k).meals.length||day(k).exs.length),...Object.keys(DB.weights)]);
  return [...s].sort();
}
function balChart(keys){
  if(!keys.length) return `<div class="empty">記録がたまるとグラフが出ます</div>`;
  const W=340,H=140,pad=18;
  const vals=keys.map(k=>{const t=totals(k);return t.ready?t.bal:0;});
  const mx=Math.max(400,DB.profile.deficit,...vals.map(Math.abs));
  const bw=(W-pad*2)/keys.length;
  const zero=H/2;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  s+=`<line x1="${pad}" y1="${zero}" x2="${W-pad}" y2="${zero}" stroke="var(--line)" stroke-width="1"/>`;
  // 目標ライン
  const gy=zero+ (DB.profile.deficit/mx)*(H/2-10);
  s+=`<line x1="${pad}" y1="${gy}" x2="${W-pad}" y2="${gy}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>`;
  keys.forEach((k,i)=>{
    const v=vals[i], hgt=Math.abs(v)/mx*(H/2-10);
    const x=pad+i*bw+bw*0.18, w=bw*0.64;
    const y=v<0?zero:zero-hgt;
    s+=`<rect x="${x}" y="${v<0?zero:zero-hgt}" width="${w}" height="${Math.max(hgt,1)}" rx="2" fill="${v<=0?'var(--minus)':'var(--plus)'}" opacity=".85"/>`;
  });
  s+=`</svg><div style="display:flex;justify-content:space-between;font-size:.68rem;color:var(--sub);padding:0 18px">
      <span>${labelShort(keys[0])}</span><span style="color:var(--accent)">‑‑ 目標 −${DB.profile.deficit}</span><span>${labelShort(keys[keys.length-1])}</span></div>`;
  return s;
}
function weightChart(){
  const ks=Object.keys(DB.weights).sort().slice(-60);
  if(ks.length<2) return `<div class="empty">体重を2日ぶん入れるとグラフが出ます</div>`;
  const W=340,H=140,pad=24;
  const vs=ks.map(k=>DB.weights[k]);
  let lo=Math.min(...vs), hi=Math.max(...vs);
  if(DB.profile.goalWeight) hi=Math.max(hi,DB.profile.goalWeight);
  if(DB.profile.goalWeight) lo=Math.min(lo,DB.profile.goalWeight);
  const m=Math.max(1,(hi-lo)*0.25); lo-=m; hi+=m;
  const t0=dateOf(ks[0]).getTime(), t1=dateOf(ks[ks.length-1]).getTime();
  const X=k=>pad+((dateOf(k).getTime()-t0)/Math.max(1,t1-t0))*(W-pad*2);
  const Y=v=>H-16-((v-lo)/(hi-lo))*(H-30);
  let d="",dots="";
  ks.forEach((k,i)=>{ const x=X(k),y=Y(DB.weights[k]); d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="var(--accent)"/>`; });
  let g="";
  if(DB.profile.goalWeight){ const gy=Y(DB.profile.goalWeight);
    g=`<line x1="${pad}" y1="${gy}" x2="${W-pad}" y2="${gy}" stroke="var(--plus)" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>
       <text class="chart-lg" x="${W-pad}" y="${gy-4}" text-anchor="end" fill="var(--plus)">目標 ${DB.profile.goalWeight}kg</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <text class="chart-lg" x="2" y="${Y(hi-m).toFixed(1)}">${(hi-m).toFixed(1)}</text>
    <text class="chart-lg" x="2" y="${Y(lo+m).toFixed(1)}">${(lo+m).toFixed(1)}</text>
    ${g}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <text class="chart-lg" x="${pad}" y="${H-2}">${labelShort(ks[0])}</text>
    <text class="chart-lg" x="${W-pad}" y="${H-2}" text-anchor="end">${labelShort(ks[ks.length-1])}</text>
  </svg>`;
}

function moveFav(t,i,d){

function delFav(t,id){

function wipe(){

  if(!confirm(syncOn()?"Dropbox で同期しているので、ほかの端末からも消えます。本当に消しますか？":"本当に消しますか？")) return;
  const wasBlocked=storageBlocked;
  storageBlocked=false; DB=seed(structuredClone(DEFAULT));

const sheet=document.getElementById("sheet"), mask=document.getElementById("mask");
const shTitle=document.getElementById("shTitle"), shSeg=document.getElementById("shSeg"), shBody=document.getElementById("shBody");

let sheetOpener=null;
/* iPhoneはキーボードが出ても画面の高さが変わらず、下につけたシートがキーボードの裏に隠れる。
   見えている範囲（visualViewport）に合わせて、シートの下端と高さを動かす */
function fitSheet(){
  const vv=window.visualViewport; if(!vv) return;
  const kb=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));
  sheet.style.bottom=kb+"px";
  sheet.style.setProperty("--vvh",vv.height+"px");
}
if(window.visualViewport){ visualViewport.addEventListener("resize",fitSheet); visualViewport.addEventListener("scroll",fitSheet); }
function openSheet(title){
  sheetOpener=document.activeElement; shTitle.textContent=title;
  fitSheet(); sheet.inert=false; sheet.classList.add("on"); mask.classList.add("on");
  main.inert=true; document.querySelector("nav.tabs").inert=true; document.getElementById("top").inert=true;
  document.body.style.overflow="hidden"; document.getElementById("shClose").focus();
}
function closeSheet(){
  sheet.classList.remove("on"); mask.classList.remove("on"); sheet.inert=true;
  shBody.innerHTML=""; shSeg.innerHTML=""; document.body.style.overflow="";
  main.inert=false; document.querySelector("nav.tabs").inert=false; document.getElementById("top").inert=false;
  if(sheetOpener?.isConnected) sheetOpener.focus();
  if(syncState.pending){ syncState.pending=false; requestSync(300); }
}
document.addEventListener("keydown",e=>{
  if(!sheet.classList.contains("on")) return;
  if(e.key==="Escape"){e.preventDefault();closeSheet();}
  if(e.key==="Tab"){
    const a=[...sheet.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled&&x.getClientRects().length);
    if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus();}
    else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus();}
  }
});
document.getElementById("shClose").onclick=closeSheet;
mask.onclick=closeSheet;

function drawFood(){
  const st=sheetState;
  shSeg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===st.mode));
  let h="";
  /* 量のかけ算 */
  const qty=`<div class="qty">${[0.5,1,1.5,2].map(q=>`<button class="${st.qty===q?'on':''}" onclick="setQty(${q})">×${q}</button>`).join("")}</div>`;

    h+=qty;
    if(!DB.favFoods.length) h+=`<div class="empty">「定番」タブで登録すると、ここから1タップで入ります</div>`;

      h+=`<button class="pick" onclick="addMeal('${jsq(f.name)}',${f.kcal})">
        <span class="nm">${esc(f.name)}</span><span class="kc">${Math.round(f.kcal*st.qty)} kcal</span><span class="st">＋</span></button>`;
    });
  }
  else if(st.mode==="search"&&st.pick){
    drawGramPick(); return;
  }
  else if(st.mode==="search"){
    h+=`<input class="srch" id="fq" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ひらがなのままでOK（例：よーぐると）" value="${esc(st.q)}">`;
    const q=st.q.trim();
    let list=FOODS;
    if(q){ const nq=norm(q); list=FOODS.filter(f=>f[0].includes(q)||f[2].includes(q)||norm(f[0]).includes(nq)); }
    if(q&&list.length) h+=`<h2 class="sec" style="margin-left:0">1人前のめやす</h2>`;
    if(list.length) h+=qty;
    let lastCat="";
    list.slice(0,q?200:FOODS.length).forEach(f=>{
      if(f[2]!==lastCat&&!q){ h+=`<h2 class="sec" style="margin-left:0">${f[2]}</h2>`; lastCat=f[2]; }

    });
    if(q){
