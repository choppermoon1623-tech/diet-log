      if(!hits.length) h+=`<div class="empty">成分表には見つかりません。ひらがなや、ことばを短くするとふえます（例：「とりむね」→「むね」）</div>`;
      hits.slice(0,80).forEach(i=>{
        const f=SEIBUN[i];
        h+=`<button class="pick" onclick="pickSeibun(${i})">
          <span class="nm">${esc(seibunName(f[0]))}<small>${esc(SEIBUN_G[f[2]])}</small></span>
          <span class="kc">${f[1]} kcal<small style="display:block;font-size:.68rem;text-align:right">/100g</small></span><span class="st">g</span></button>`;
      });
      if(hits.length>80) h+=`<div class="empty">ほか${hits.length-80}件。ことばを足すとしぼれます（例：「むね 皮なし」）</div>`;
      /* 市販の商品（同梱リスト → 見つからなければネット） */
      h+=drawProducts(q);
      h+=`<h2 class="sec" style="margin-left:0">ネットでさがす</h2>`+drawNetResults(q);
    }else{
      h+=`<div class="empty" style="text-align:left">ことばを入れると、<b>食品成分表（2,478食品）</b>と<b>市販の商品（約1.6万件）</b>もさがせます。バーコードの数字（13けた）でもOK。</div>`;
    }
  }
  else if(st.mode==="photo"){
    drawPhoto(); return;
  }
  else{
    h+=`<div class="fld"><label for="mName">名前</label><input id="mName" type="text" maxlength="300" placeholder="例：母さんの肉じゃが"></div>
      <div class="fld"><label for="mKcal">カロリー (kcal)</label><input id="mKcal" type="number" inputmode="numeric" placeholder="例：250"></div>
      <label class="chk"><input type="checkbox" id="mFav">定番にも登録しておく</label>
      <button class="btn" onclick="addManualMeal()">追加する</button>`;
  }
  setBody(h,"fq");
  const fq=document.getElementById("fq");
  if(fq){ liveSearch(fq,st,drawFood); }
}
function setQty(q){ sheetState.qty=q; drawFood(); }

/* シートの中身を描き直す。検索欄に入力中なら、検索欄そのものは作り直さず前後だけ差しかえる。
   作り直すと日本語入力の変換中の文字が消える（「k」を打つと再描画で消え、母音が入らない） */
/* 検索欄の入力。変換中（ひらがなの下線がある間）も結果は追うが、打つたびには描かず少し待つ */
function liveSearch(el,st,draw){
  el.oninput=e=>{
    st.q=el.value; clearTimeout(liveSearch.t);
    liveSearch.t=setTimeout(()=>{ if(sheetState===st&&el.isConnected) draw(); },e.isComposing?300:120);
  };
}
function setBody(h,keepId){
  const old=document.getElementById(keepId);
  if(!old||old.parentNode!==shBody||document.activeElement!==old){ shBody.innerHTML=h; return; }
  const tmp=document.createElement("div"); tmp.innerHTML=h;
  const nu=tmp.querySelector("#"+keepId);
  if(!nu||nu.parentNode!==tmp){ shBody.innerHTML=h; return; }
  const before=[],after=[]; let seen=false;
  [...tmp.childNodes].forEach(n=>{ if(n===nu){seen=true;return;} (seen?after:before).push(n); });
  [...shBody.childNodes].forEach(n=>{ if(n!==old) n.remove(); });
  old.before(...before); old.after(...after);
}

/* ---- 食品成分表の検索 ----
   成分表の名前は「にわとり」「ぶた」「めし」のように、ふだんの言い方と違うことが多い。
   ことばの置きかえ表で寄せてから、スペースで区切った語が全部ふくまれるものを拾う */
function toKata(s){ return s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)); }
function norm(s){
  return String(s).normalize("NFKC").toLowerCase()
    .replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}
const SYNONYMS={
  "ごはん":"水稲めし","ご飯":"水稲めし","らいす":"水稲めし","白米":"水稲めし 精白米","玄米":"玄米","米":"こめ",
  "豚肉":"ぶた","ぶたにく":"ぶた","豚":"ぶた","牛肉":"うし","ぎゅうにく":"うし","牛乳":"牛乳","ぎゅうにゅう":"牛乳","牛":"うし",
  "鶏肉":"にわとり","とりにく":"にわとり","鶏卵":"鶏卵","鶏":"にわとり","鳥":"にわとり","とり":"にわとり",
  "たまご":"卵","玉子":"卵","ゆで卵":"卵 ゆで","胸":"むね","腿":"もも",
  "唐揚げ":"から揚げ","唐揚":"から揚げ","からあげ":"から揚げ","餃子":"ぎょうざ","焼売":"しゅうまい",
  "とうふ":"豆腐","なっとう":"納豆","味噌":"みそ","醤油":"しょうゆ","胡麻":"ごま","蒟蒻":"こんにゃく","若布":"わかめ","海苔":"のり",
  "玉ねぎ":"たまねぎ","玉葱":"たまねぎ","人参":"にんじん","大根":"だいこん","胡瓜":"きゅうり","茄子":"なす","南瓜":"かぼちゃ",
  "馬鈴薯":"じゃがいも","薩摩芋":"さつまいも","林檎":"りんご","蜜柑":"みかん","苺":"いちご","葡萄":"ぶどう",
  "鮭":"さけ","さーもん":"さけ","鯖":"さば","鮪":"まぐろ","鰯":"いわし","鯵":"あじ","秋刀魚":"さんま","鰤":"ぶり","鱈":"たら",
  "海老":"えび","蟹":"かに","烏賊":"いか","蛸":"たこ","麺":"めん","饂飩":"うどん","蕎麦":"そば","餅":"もち"
};
const SYN_RE=new RegExp(Object.keys(SYNONYMS).sort((a,b)=>b.length-a.length).join("|"),"g");
let SEIBUN_N=null;   // 検索用に正規化した名前（はじめて検索したときに作る）
function searchSeibun(q){
  if(!SEIBUN_N) SEIBUN_N=SEIBUN.map(f=>norm(f[0]));
  const toks=norm(q).replace(SYN_RE,m=>" "+SYNONYMS[m]+" ").split(/[\s・,、]+/).filter(Boolean);
  if(!toks.length) return [];
  const hit=[];
  SEIBUN_N.forEach((n,i)=>{ if(toks.every(t=>n.includes(t))) hit.push(i); });
  /* ならべ順：表示名（分類の見出しを除いた部分）に当たる／語の頭で当たる／名前が短い ものを先に。
     副品目（皮・内臓など）・親鶏・お菓子は、ふだんの検索では後ろへ（「納豆」で甘納豆が先に出ないように） */
  const score=i=>{
    const f=SEIBUN[i], d=norm(seibunName(f[0])), segs=d.replace(/[\[\]()]/g," ").split(/\s+/);
    let s=d.length;
    if(!toks.every(t=>d.includes(t))) s+=1000;
    toks.forEach(t=>{ if(!segs.some(g=>g.startsWith(t))) s+=30; });
    if(/副品目|親・/.test(f[0])) s+=150;
    if(f[2]===14) s+=100;
    return s;
  };
  const sc={}; hit.forEach(i=>sc[i]=score(i));
  return hit.sort((a,b)=>sc[a]-sc[b]);
}
/* 「＜魚類＞ （さけ・ます類） しろさけ 焼き」→「しろさけ 焼き」 */
function seibunName(s){ return s.replace(/^(＜[^＞]*＞\s*)?(（[^）]*）\s*)?/,"").trim()||s; }
function pickSeibun(i){
  const f=SEIBUN[i];
  sheetState.pick={name:seibunName(f[0]),per100:f[1],g:100,serving:null,src:"食品成分表（八訂）"};
  drawFood();
}

/* ---- 市販の商品（同梱リスト） ----
   Open Food Facts の検索サーバは混んでいて 503 で落ちることが多い（2026-09 に試すと4回に3回）。
   日本で売られている商品は products-jp.json に前もってまとめ、手元で引く（作り直しは tools/build_products.mjs）。
   はじめて検索したときに読みこみ、あとはブラウザのキャッシュから */
let PRODUCTS=null, PRODUCTS_N=null, productsP=null, productsErr=false;
function loadProducts(){
  if(PRODUCTS||productsP) return;
  productsErr=false;
  productsP=fetch("products-jp.json").then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }).then(j=>{
    PRODUCTS=j.items.map(a=>({name:a[0],brand:a[1],per100:a[2],serving:a[3]!=null?{kcal:a[3],g:a[4],label:a[5]}:null,code:a[6]}));
    PRODUCTS_N=PRODUCTS.map(p=>norm(p.brand+" "+p.name));
  }).catch(()=>{ productsErr=true; }).finally(()=>{
    productsP=null;
    const st=sheetState;
    if(st&&st.kind==="food"&&st.mode==="search"&&!st.pick&&st.q.trim()) drawFood();
  });
}
function searchProducts(q){
  const code=q.replace(/[\s-]/g,"");
  if(/^\d{8,14}$/.test(code)) return PRODUCTS.map((p,i)=>i).filter(i=>PRODUCTS[i].code===code);
  const toks=norm(q).split(/[\s・,、]+/).filter(Boolean);
  if(!toks.length) return [];
  const hit=[];
  PRODUCTS_N.forEach((n,i)=>{ if(toks.every(t=>n.includes(t))) hit.push(i); });
  /* 商品名（ブランドでなく）に当たる・語の頭で当たる・名前が短い ものを先に */
  const score=i=>{ const n=norm(PRODUCTS[i].name); let s=n.length; toks.forEach(t=>{ if(!n.includes(t)) s+=200; else if(!n.startsWith(t)) s+=20; }); return s; };
  const sc={}; hit.forEach(i=>sc[i]=score(i));
  return hit.sort((a,b)=>sc[a]-sc[b]);
}
function productRow(p,onclick){
  return `<button class="pick" onclick="${onclick}">
      <span class="nm">${esc(p.name)}<small>${esc([p.brand,p.serving?`1食 ${p.serving.label}`:""].filter(Boolean).join("・"))}</small></span>
      <span class="kc">${p.serving?`${p.serving.kcal} kcal<small style="display:block;font-size:.68rem;text-align:right">/1食</small>`:`${p.per100} kcal<small style="display:block;font-size:.68rem;text-align:right">/100g</small>`}</span><span class="st">＋</span></button>`;
}
function drawProducts(q){
  if(!PRODUCTS){
    if(productsErr) return `<h2 class="sec" style="margin-left:0">市販の商品</h2><div class="empty">商品リストを読みこめませんでした。<br><button class="btn" style="margin-top:8px" onclick="loadProducts();drawFood()">もう一度</button></div>`;
    loadProducts();
    return `<h2 class="sec" style="margin-left:0">市販の商品</h2><div class="empty">商品リストを読みこみ中…</div>`;
  }
  const hits=searchProducts(q);
  let h=`<h2 class="sec" style="margin-left:0">市販の商品（${hits.length}件）</h2>`;
  if(!hits.length) h+=`<div class="empty">日本の商品 ${PRODUCTS.length.toLocaleString()}件には見つかりません。商品名の一部やメーカー名でもさがせます</div>`;
  hits.slice(0,60).forEach(i=>{ h+=productRow(PRODUCTS[i],`pickProduct(${i})`); });
  if(hits.length>60) h+=`<div class="empty">ほか${hits.length-60}件。ことばを足すとしぼれます（例：「ヨーグルト 明治」）</div>`;
  if(hits.length) h+=`<div class="help" style="margin-top:6px">Open Food Facts（だれでも登録できるデータ）より。パッケージの表示と違うときは、パッケージを信じてください。</div>`;
  return h;
}
function pickProduct(i){ pickFromProduct(PRODUCTS[i]); }
function pickFromProduct(p){
  sheetState.pick={name:(p.brand?p.brand+" ":"")+p.name,per100:p.per100,serving:p.serving,
    g:p.serving&&p.serving.g?p.serving.g:100,useServing:!!p.serving,src:"Open Food Facts"};
  drawFood();
}

/* ---- 市販の商品（Open Food Facts へ直接） ----
   無料・登録不要の公開データベース。だれでも登録できるので数字の誤りもある。
   1分あたりの回数制限があるので、入力のたびではなくボタンを押したときだけ問い合わせる */
function drawNetResults(q){
  const n=sheetState.net;
  if(!n||n.q!==q){
    return `<button class="btn" style="background:var(--bg);color:var(--accent)" onclick="netSearch()">🌐「${esc(q)}」をネットでさがす</button>
      <div class="help" style="margin-top:6px">上に無いとき用。Open Food Facts（世界の食品パッケージ情報）に直接たずねます。混んでいてつながりにくいことがあります。</div>`;
  }
  if(n.state==="loading") return `<div class="empty">さがしています…${n.try>1?`（混んでいるので${n.try}回目）`:""}</div>`;
  if(n.state==="error") return `<div class="empty">相手のサーバが混んでいて、つながりませんでした（${esc(n.msg)}）。少し待ってからもう一度どうぞ。<br><button class="btn" style="margin-top:8px" onclick="netSearch()">もう一度</button></div>`;
  if(!n.items.length) return `<div class="empty">見つかりませんでした。日本の商品は登録が少なめです。パッケージの数字を「手入力」でどうぞ</div>`;
  return n.items.map((p,i)=>productRow(p,`pickNet(${i})`)).join("")
    +`<div class="help" style="margin-top:6px">だれでも登録できるデータです。パッケージの表示と違うときは、パッケージを信じてください。</div>`;
}
async function netSearch(){
  const st=sheetState, q=st.q.trim();
  if(!q) return;
  st.net={q,state:"loading",items:[],try:1}; drawFood();
  const fields="code,product_name,product_name_ja,brands,nutriments,serving_quantity,serving_size";
  const code=q.replace(/[\s-]/g,""), barcode=/^\d{8,14}$/.test(code);
  /* 商品名はカタカナが多いので、ひらがなだけの入力（「よーぐると」）はカタカナでも引く */
  const words=barcode?[q]:[...new Set([q,/^[ぁ-ゖー\s]+$/.test(q)?toKata(q):q])];
  const url=(host,w)=>barcode
    ? `https://${host}.openfoodfacts.org/api/v2/product/${code}.json?fields=${fields}`
    : `https://${host}.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(w)}&search_simple=1&json=1&page_size=40&fields=${fields}`;
  const alive=()=>sheetState===st&&st.net&&st.net.q===q&&st.net.state==="loading";
  /* 検索サーバは 503 を返すことが多い（503 には CORS ヘッダーが無く、ブラウザには「通信エラー」に見える）。
     入口（world/jp）を替えながら、間をあけて4回まで取り直す */
  const HOSTS=["world","jp","world","jp"], WAIT=[0,1500,3000,5000];
  let lastErr="";
  const one=async w=>{
    for(let t=0;t<HOSTS.length;t++){
      if(!alive()) throw new Error("gone");
      if(t){ if(st.net.try<t+1){ st.net.try=t+1; drawFood(); } await new Promise(r=>setTimeout(r,WAIT[t])); }
      try{
        const ac=new AbortController(), timer=setTimeout(()=>ac.abort(),10000);
        const r=await fetch(url(HOSTS[t],w),{signal:ac.signal}).finally(()=>clearTimeout(timer));
        if(barcode&&r.status===404) return [];
        if(!r.ok){ lastErr="HTTP "+r.status; continue; }
        const j=await r.json();
        return barcode?(j.product?[j.product]:[]):(j.products||[]);
      }catch(e){ lastErr=e.name==="AbortError"?"時間切れ":"通信エラー"; }
    }
    throw new Error(lastErr);
  };
  const res=await Promise.allSettled(words.map(one));
  if(!alive()) return;   // 待っている間に閉じた・ことばを変えた
  const ok=res.filter(r=>r.status==="fulfilled");
  if(!ok.length){
    st.net={q,state:"error",items:[],msg:lastErr||"通信エラー"};
  }else{
    const seen=new Set();
    const items=ok.flatMap(r=>r.value).map(offItem).filter(p=>{ if(!p) return false; const k=p.brand+"|"+p.name; if(seen.has(k)) return false; seen.add(k); return true; });
    st.net={q,state:"done",items};
  }
  if(st.kind==="food"&&st.mode==="search"&&!st.pick) drawFood();
}
/* 商品データを {name, brand, per100, serving} に。ありえない数字（100gで900kcal超など）は捨てる */
function offItem(p){
  const nt=p.nutriments||{};
  const name=String(p.product_name_ja||p.product_name||"").trim();
  if(!name) return null;
  let per100=Number(nt["energy-kcal_100g"]);
  if(!(per100>0)&&Number(nt["energy_100g"])>0) per100=Number(nt["energy_100g"])/4.184;
  per100=per100>0&&per100<=900?Math.round(per100):null;
  let serving=null;
  const sk=Number(nt["energy-kcal_serving"]), sg=Number(p.serving_quantity);
  if(sk>0&&sk<=3000) serving={kcal:Math.round(sk),g:sg>0?sg:null,label:String(p.serving_size||"").slice(0,30)};
  else if(per100&&sg>0&&sg<=2000) serving={kcal:Math.round(per100*sg/100),g:sg,label:String(p.serving_size||sg+"g").slice(0,30)};
  if(serving&&per100&&serving.g===100&&/^100\s*g$/i.test(serving.label.trim())) serving=null;   // 「1食=100g」は100gあたりの言いかえなので1食あつかいしない
  if(!per100&&!serving) return null;
  const brand=String(p.brands||"").split(",")[0].trim().slice(0,40);
  return {name:name.slice(0,120),brand,per100,serving};
}
function pickNet(i){ pickFromProduct(sheetState.net.items[i]); }

/* ---- グラムを入れてカロリーを出す ---- */
function gramKcal(pk){
  if(pk.useServing) return pk.serving.kcal*(pk.sq||1);
  return pk.per100!=null?Math.round(pk.per100*pk.g/100):0;
}
function drawGramPick(){
  const pk=sheetState.pick;
  let h=`<button class="pick" style="border:none;color:var(--accent)" onclick="sheetState.pick=null;drawFood()"><span class="nm">← 検索結果にもどる</span></button>
    <div class="card" style="margin:0 0 12px"><div style="font-weight:700">${esc(pk.name)}</div>
    <div class="help">${pk.per100!=null?`100gあたり ${pk.per100} kcal`:""}${pk.serving?`${pk.per100!=null?"・":""}1食（${esc(pk.serving.label||"1食")}）${pk.serving.kcal} kcal`:""}　<span style="opacity:.8">出典：${esc(pk.src)}</span></div></div>`;
  if(pk.serving){
    h+=`<div class="qty"><button class="${pk.useServing?'on':''}" onclick="setPick('useServing',true)">1食ぶんで</button>
      ${pk.per100!=null?`<button class="${pk.useServing?'':'on'}" onclick="setPick('useServing',false)">グラムで</button>`:""}</div>`;
  }
  if(pk.useServing){
    h+=`<div class="qty">${[0.5,1,1.5,2].map(q=>`<button class="${(pk.sq||1)===q?'on':''}" onclick="setPick('sq',${q})">×${q}</button>`).join("")}</div>`;
  }else{
    h+=`<div class="fld"><label for="pg">食べた量（g）</label><input id="pg" type="number" inputmode="decimal" min="1" max="5000" value="${pk.g}"></div>
      <div class="qty">${[30,50,100,150,200].map(g=>`<button class="${pk.g===g?'on':''}" onclick="setPick('g',${g})">${g}g</button>`).join("")}</div>`;
  }
  h+=`<div style="text-align:center;font-size:1.6rem;font-weight:800;margin:10px 0" id="pk">${gramKcal(pk)} kcal</div>
    <label class="chk"><input type="checkbox" id="pFav">この量で定番にも登録しておく</label>
    <button class="btn" onclick="addPickMeal()">追加する</button>`;
  shBody.innerHTML=h;
  const pg=document.getElementById("pg");
  if(pg) pg.oninput=()=>{ const v=parseFloat(pg.value); pk.g=v>0&&v<=5000?v:0; document.getElementById("pk").textContent=gramKcal(pk)+" kcal";
    document.querySelectorAll("#shBody .qty button").forEach(b=>b.classList.toggle("on",b.textContent===pk.g+"g")); };
}
function setPick(k,v){ sheetState.pick[k]=v; drawGramPick(); }
function addPickMeal(){
  const pk=sheetState.pick, k=gramKcal(pk);
  if(!pk.useServing&&!(pk.g>0)){ toast("量（g）を入れてください"); return; }
  const amount=pk.useServing?((pk.sq||1)===1?"1食":`1食×${pk.sq}`):`${Math.round(pk.g*10)/10}g`;
  const name=`${pk.name} ${amount}`.slice(0,300);
  if(document.getElementById("pFav").checked) DB.favFoods.push({id:uid(),name,kcal:k,slot:null});
  day(cur).meals.push({id:uid(),name,kcal:k,q:1,slot:sheetState.slot});
  save(); toast(pk.name+" を追加"); closeSheet(); render();
}
function addMeal(name,kcal){
  const q=sheetState.qty||1;
  day(cur).meals.push({id:uid(),name,kcal:Math.round(kcal*q),q,slot:sheetState.slot});
  save(); toast(name+" を追加"); closeSheet(); render();
}
function addManualMeal(){
  const n=document.getElementById("mName").value.trim();
  const k=parseInt(document.getElementById("mKcal").value);
  if(!n||n.length>300||!Number.isFinite(k)||k<0||k>50000){ toast("名前と0〜50000のカロリーを入れてください"); return; }
  if(document.getElementById("mFav").checked) DB.favFoods.push({id:uid(),name:n,kcal:k,slot:null});
  day(cur).meals.push({id:uid(),name:n,kcal:k,q:1,slot:sheetState.slot});
  save(); toast("追加しました"); closeSheet(); render();
}
/* ---- 写真でしらべる（Claudeアプリに聞いて、答えを貼りもどす） ---- */
function drawPhoto(){
  const st=sheetState;
  if(st.parsed){ drawPhotoResult(); return; }
  const slotName=SLOTS.find(x=>x[0]===st.slot)[1];
  shBody.innerHTML=`
    <div class="step"><span class="no">1</span>
      <h4>質問文をコピーする</h4>
      <p>写真といっしょにClaudeへ渡す文です。量の見積もり方まで指定してあります。</p>
      <button class="btn" onclick="copyPrompt()">📋 質問文をコピー</button>
      <details style="margin-top:9px"><summary>中身を見る・手で選んでコピーする</summary>
        <textarea class="ta ro" id="pPrompt" readonly>${esc(PHOTO_PROMPT)}</textarea>
      </details>
    </div>
    <div class="step"><span class="no">2</span>
      <h4>Claudeで写真を撮って、貼る</h4>
      <p>Claudeを開いたら、カメラで食事を撮って、さっきの文を貼りつけて送ります。</p>
      <a class="btn sub" href="https://claude.ai/new" target="_blank" rel="noopener">🤖 Claudeを開く</a>
    </div>
    <div class="step"><span class="no">3</span>
      <h4>返ってきた答えを貼る</h4>
      <p>Claudeの返事をまるごと貼って大丈夫です。【記録】の行だけ拾います。</p>
      <textarea class="ta" id="pAns" placeholder="ここにClaudeの返事を貼りつける">${esc(st.ans||"")}</textarea>
      <button class="btn" style="margin-top:9px" onclick="readAnswer()">読みこんで ${esc(slotName)}に入れる</button>
    </div>`;
}
function copyPrompt(){
  const done=()=>toast("質問文をコピーしました");
  const fallback=()=>{
    const d=shBody.querySelector("details"); if(d) d.open=true;
    const ta=document.getElementById("pPrompt");
    if(ta){ ta.focus(); ta.setSelectionRange(0,PHOTO_PROMPT.length); toast("長押しして「コピー」を選んでください"); }
    else toast("コピーできませんでした");
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(PHOTO_PROMPT).then(done).catch(fallback);
  }else fallback();
}
/* Claudeの返事から「品名 と カロリー」を拾う。形式が多少ぶれても拾えるようにしてある */
function parseMealText(raw){
  const out=[]; let claimed=null;
  for(let line of String(raw).replace(/\r/g,"").split("\n")){
    line=line.replace(/[*`_]/g,"").trim();
    if(!line) continue;
    if(/^[=\-–—_]{3,}$/.test(line)) continue;
    // 箇条書きの記号や番号を先に落とす（「- 合計 | 614」を合計と見抜くため）
    line=line.replace(/^[-–—・●○◆■□☆★•]+\s*/,"").replace(/^\d+[.)）]\s*/,"").trim();
    if(!line) continue;
    const isTotal=/^[【\[(（]?\s*(合計|計|総計|トータル|total)/i.test(line);
    if(/^[【\[(（]?\s*(記録|こんだて|献立|内訳|以上|品名)/.test(line)&&!isTotal) continue;
    let m=line.match(/^(.+?)\s*[|｜:：]\s*(?:約|およそ)?\s*([0-9]{1,5})\s*(?:kcal|キロカロリー|カロリー)?\s*[)）】\]]?\s*$/i)
       || line.match(/^(.+?)[\s.、,:：…・]*(?:約|およそ)?\s*([0-9]{1,5})\s*(?:kcal|キロカロリー)\s*[)）】\]]?\s*$/i);
    if(!m) continue;
    const kcal=parseInt(m[2],10);
    if(!isFinite(kcal)||kcal<=0||kcal>5000) continue;
    if(isTotal){ claimed=kcal; continue; }
    let name=m[1].replace(/[\s:：|｜【\[]+$/,"").trim();
    if(!name||name.length>30) continue;   // 長すぎるのは地の文が紛れこんだもの
    out.push({name,kcal,on:true});
  }
  return {items:out,claimed};
}
function readAnswer(){
  const ta=document.getElementById("pAns");
  const txt=ta?ta.value:"";
  sheetState.ans=txt;
  if(!txt.trim()){ toast("答えを貼りつけてください"); return; }
  const r=parseMealText(txt);
  if(!r.items.length){
    toast("品名とカロリーが読み取れませんでした");
    return;
  }
  sheetState.parsed=r.items; sheetState.claimed=r.claimed;
  drawPhotoResult();
}
function drawPhotoResult(){
  const st=sheetState, slotName=SLOTS.find(x=>x[0]===st.slot)[1];
  let h=`<p style="font-size:.8rem;color:var(--sub);margin:2px 0 10px">
    ${st.parsed.length}品 読み取りました。いらないものはチェックを外し、数字は直せます。</p>`;
  st.parsed.forEach((it,i)=>{
    h+=`<div class="res${it.on?"":" off"}" id="res${i}">
      <input type="checkbox" id="rc${i}" ${it.on?"checked":""} onchange="togRes(${i})">
      <span class="nm" onclick="document.getElementById('rc${i}').click()">${esc(it.name)}</span>
      <input type="number" inputmode="numeric" value="${it.kcal}" onchange="setResK(${i},this)">
      <span class="u">kcal</span></div>`;
  });
  h+=`<div class="sumline"><span>${esc(slotName)}に追加する合計</span><b id="resSum">0</b></div>`;
  if(st.claimed!=null) h+=`<p style="font-size:.74rem;color:var(--sub);margin:0 0 8px">Claudeの言う合計は ${st.claimed} kcal</p>`;
  h+=`<button class="btn" onclick="addParsed()">この内容で追加する</button>
      <button class="btn sub" style="margin-top:8px" onclick="backToPhoto()">貼りなおす</button>`;
  shBody.innerHTML=h;
  updResSum();
}
function togRes(i){
  const cb=document.getElementById("rc"+i);
  sheetState.parsed[i].on=cb.checked;
  document.getElementById("res"+i).classList.toggle("off",!cb.checked);
  updResSum();
}
function setResK(i,el){
  const v=parseInt(el.value,10);
  if(!Number.isFinite(v)||v<0||v>50000){el.value=sheetState.parsed[i].kcal;toast("カロリーは0〜50000で入力してください");return;}
  sheetState.parsed[i].kcal=v;
  updResSum();
}
function updResSum(){
  const el=document.getElementById("resSum"); if(!el) return;
  el.textContent=sheetState.parsed.filter(x=>x.on).reduce((s,x)=>s+x.kcal,0)+" kcal";
}
function backToPhoto(){ sheetState.parsed=null; sheetState.claimed=null; drawPhoto(); }
function addParsed(){
  const picked=sheetState.parsed.filter(x=>x.on&&x.kcal>0);
  if(!picked.length){ toast("追加するものがありません"); return; }
  for(const it of picked) day(cur).meals.push({id:uid(),name:it.name,kcal:it.kcal,q:1,slot:sheetState.slot});
  save(); toast(picked.length+"品を追加しました"); closeSheet(); render();
}
function delMeal(id){ removeEntry("meals",id); }

/* ---- 運動を追加 ---- */
function openEx(){
  if(!weightAt(cur)){ toast("先に体重を入れてください"); return; }
  sheetState={kind:"ex",mode:DB.favExs.length?"fav":"search",q:"",min:30};
  openSheet("運動を追加");
  shSeg.innerHTML=`<div class="seg">
    <button data-m="fav">定番</button><button data-m="search">さがす</button><button data-m="manual">手入力</button></div>`;
  shSeg.querySelectorAll("button").forEach(b=>b.onclick=()=>{sheetState.mode=b.dataset.m;drawEx();});
  drawEx();
}
function drawEx(){
  const st=sheetState;
  shSeg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===st.mode));
  let h="";
  const mins=`<div class="qty">${[10,20,30,45,60].map(m=>`<button class="${st.min===m?'on':''}" onclick="setMin(${m})">${m}分</button>`).join("")}</div>`;

  if(st.mode==="fav"){
    if(!DB.favExs.length) h+=`<div class="empty">「定番」タブで登録すると、ここから1タップで入ります</div>`;
    DB.favExs.forEach(f=>{
      h+=`<button class="pick" onclick="addEx('${jsq(f.name)}',${f.mets},${f.min})">
        <span class="nm">${esc(f.name)}<small>${f.min}分</small></span>
        <span class="kc">${exKcal(f.mets,f.min,cur)} kcal</span><span class="st">＋</span></button>`;
    });
  }
  else if(st.mode==="search"){
    h+=`<input class="srch" id="eq" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="運動名でさがす（例：歩）" value="${esc(st.q)}">`+mins;
    let list=EXS; const q=st.q.trim();
    if(q) list=EXS.filter(e=>e[0].includes(q));
    if(!list.length) h+=`<div class="empty">見つかりません</div>`;
    list.forEach(e=>{
      h+=`<button class="pick" onclick="addEx('${jsq(e[0])}',${e[1]},${st.min})">
        <span class="nm">${esc(e[0])}<small>${e[1]} METs</small></span>
        <span class="kc">${exKcal(e[1],st.min,cur)} kcal</span><span class="st">＋</span></button>`;
    });
  }
  else{
    h+=`<div class="fld"><label for="eName">名前</label><input id="eName" type="text" maxlength="300" placeholder="例：犬の散歩"></div>
      <div class="fld"><div class="two">
        <div><label for="eMin">時間（分）</label><input id="eMin" type="number" inputmode="numeric" value="30"></div>
        <div><label for="eMets">強さ METs</label><input id="eMets" type="number" inputmode="decimal" step="0.1" value="4.0"></div>
      </div></div>
      <div class="help" style="margin-bottom:10px">METsの目安：のんびり歩く3／速歩4.3／自転車6.8／ジョギング8.3／筋トレ6</div>
      <label class="chk"><input type="checkbox" id="eFav">定番にも登録しておく</label>
      <button class="btn" onclick="addManualEx()">追加する</button>`;
  }
  setBody(h,"eq");
  const eq=document.getElementById("eq");
  if(eq){ liveSearch(eq,st,drawEx); }
}
function setMin(m){ sheetState.min=m; drawEx(); }
function addEx(name,mets,min){
  day(cur).exs.push({id:uid(),name,mets,min,kcal:exKcal(mets,min,cur)});
  save(); toast(name+" を追加"); closeSheet(); render();
}
function addManualEx(){
  const n=document.getElementById("eName").value.trim();
  const m=parseInt(document.getElementById("eMin").value);
  const mt=parseFloat(document.getElementById("eMets").value);
  if(!n||n.length>300||!Number.isFinite(m)||m<=0||m>1440||!Number.isFinite(mt)||mt<1||mt>30){ toast("名前・時間（1〜1440分）・METs（1〜30）を確認してください"); return; }
  if(document.getElementById("eFav").checked) DB.favExs.push({id:uid(),name:n,mets:mt,min:m});
  day(cur).exs.push({id:uid(),name:n,mets:mt,min:m,kcal:exKcal(mt,m,cur)});
  save(); toast("追加しました"); closeSheet(); render();
}
function delEx(id){ removeEntry("exs",id); }

/* ---- 定番の編集 ---- */
function openFavEdit(kind){
  sheetState={kind:"favedit",t:kind,mode:"search",q:""};
  openSheet(kind==="food"?"定番の食べもの":"定番の運動");
  shSeg.innerHTML=`<div class="seg"><button data-m="search">一覧からえらぶ</button><button data-m="manual">自分で入れる</button></div>`;
  shSeg.querySelectorAll("button").forEach(b=>b.onclick=()=>{sheetState.mode=b.dataset.m;drawFavEdit();});
  drawFavEdit();
}
function drawFavEdit(){
  const st=sheetState;
  shSeg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===st.mode));
  let h="";
  if(st.mode==="search"){
    h+=`<input class="srch" id="vq" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="名前でさがす" value="${esc(st.q)}">`;
    const q=st.q.trim();
    if(st.t==="food"){
      let list=q?FOODS.filter(f=>f[0].includes(q)||f[2].includes(q)):FOODS;
      list.forEach(f=>{ h+=`<button class="pick" onclick="addFav('food','${jsq(f[0])}',${f[1]})">
        <span class="nm">${esc(f[0])}${f[3]?`<small>${f[3]}</small>`:""}</span><span class="kc">${f[1]} kcal</span><span class="st">＋</span></button>`; });
    }else{
      let list=q?EXS.filter(e=>e[0].includes(q)):EXS;
      list.forEach(e=>{ h+=`<button class="pick" onclick="addFav('ex','${jsq(e[0])}',${e[1]})">
        <span class="nm">${esc(e[0])}<small>${e[1]} METs</small></span><span class="st">＋</span></button>`; });
    }
  }else{
    if(st.t==="food"){
      h+=`<div class="fld"><label for="fvN">名前</label><input id="fvN" type="text" maxlength="300" placeholder="例：コンビニの鮭おにぎり"></div>
        <div class="fld"><label for="fvK">カロリー (kcal)</label><input id="fvK" type="number" inputmode="numeric"></div>
        <button class="btn" onclick="addFavManual()">登録する</button>`;
    }else{
      h+=`<div class="fld"><label for="fvN">名前</label><input id="fvN" type="text" maxlength="300" placeholder="例：朝のウォーキング"></div>
        <div class="fld"><div class="two">
          <div><label for="fvM">時間（分）</label><input id="fvM" type="number" inputmode="numeric" value="30"></div>
          <div><label for="fvT">強さ METs</label><input id="fvT" type="number" inputmode="decimal" step="0.1" value="4.0"></div>
        </div></div>
        <button class="btn" onclick="addFavManual()">登録する</button>`;
    }
  }
  setBody(h,"vq");
  const vq=document.getElementById("vq");
  if(vq){ liveSearch(vq,st,drawFavEdit); }
}
function addFav(t,name,v){
  if(t==="food") DB.favFoods.push({id:uid(),name,kcal:v,slot:null});
  else DB.favExs.push({id:uid(),name,mets:v,min:30});
  save(); toast("登録しました"); closeSheet(); renderFav();
}
function addFavManual(){
  const n=document.getElementById("fvN").value.trim();
  if(!n||n.length>300){ toast("名前は1〜300文字で入力してください"); return; }
  if(sheetState.t==="food"){
    const k=parseInt(document.getElementById("fvK").value);
    if(!Number.isFinite(k)||k<0||k>50000){ toast("カロリーは0〜50000で入力してください"); return; }
    DB.favFoods.push({id:uid(),name:n,kcal:k,slot:null});
  }else{
    const m=parseInt(document.getElementById("fvM").value), t=parseFloat(document.getElementById("fvT").value);
    if(!Number.isFinite(m)||m<=0||m>1440||!Number.isFinite(t)||t<1||t>30){ toast("時間（1〜1440分）とMETs（1〜30）を確認してください"); return; }
    DB.favExs.push({id:uid(),name:n,mets:t,min:m});
  }
  save(); toast("登録しました"); closeSheet(); renderFav();
}

/* ============================================================
   書き出し／読みこみ
   ============================================================ */
function expo(){
  const d=new Date();
  const fn="dietlog_"+keyOf(d).replace(/-/g,"")+".json";
  const blob=new Blob([storageBlocked ? (localStorage.getItem(KEY)||"{}") : JSON.stringify(DB,null,1)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=fn; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
  toast("書き出しました");
}
document.getElementById("fileIn").addEventListener("change",async function(){
  const f=this.files[0]; this.value=""; if(!f) return;
  try{
    if(f.size>10000000) throw new Error("10MB以下のファイルを選んでください");
    const d=validateDB(JSON.parse(await f.text()));
    sheetState={kind:"import",data:d}; openSheet("バックアップを確認");
    shSeg.innerHTML="";
    shBody.innerHTML=`<p>食事・運動 ${Object.keys(d.days).length}日／体重 ${Object.keys(d.weights).length}日</p>
      <p class="help">読み込む方法を選んでください。置き換える前に、今のデータを書き出して保管できます。</p>
      <button class="btn sub" onclick="expo()">今のデータを書き出す</button>
      <button class="btn" onclick="applyImport(false)">記録のない日だけ追加</button>
      <button class="btn warn" onclick="applyImport(true)">すべて置き換える…</button>`;
  }catch(e){toast("読み込めません："+e.message);}
});
function applyImport(replace){
  const d=sheetState.data;
  if(replace&&!confirm("今の記録・設定・定番をバックアップの内容に置き換えます。よろしいですか？")) return;
  if(storageBlocked&&!replace){toast("元データを保護中です。書き出して保管し、置き換えを選んでください");return;}
  const wasBlocked=storageBlocked;
  if(replace){storageBlocked=false;DB=d;}
  else{
    for(const [k,v] of Object.entries(d.days)) if(!DB.days[k]||(!DB.days[k].meals.length&&!DB.days[k].exs.length)) DB.days[k]=v;
    for(const [k,v] of Object.entries(d.weights)) if(DB.weights[k]==null) DB.weights[k]=v;
    for(const key of ["favFoods","favExs"]){
      const have=new Set(DB[key].map(x=>x.name));
      d[key].forEach(x=>{if(!have.has(x.name)){DB[key].push(x);have.add(x.name);}});
    }
  }
  if(!save()){storageBlocked=wasBlocked;return;}
  closeSheet();cur=todayKey();render();toast("読み込みました");
}

/* ============================================================
   こまごま
   ============================================================ */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
/* onclick="f('…')" の中に入れる用：JS文字列 → HTML属性 の二重エスケープ */
function jsq(s){ return esc(JSON.stringify(String(s)).slice(1,-1).replace(/'/g,"\\'")); }
let toastT;
function toast(msg){
  const t=document.getElementById("toast");
  if(saveFailed){saveFailed=false;return;}
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1700);
}
function go(t,k){ const moved=(tab!==t); tab=t; if(k) cur=k; render(); if(moved) window.scrollTo(0,0); }
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab,b.dataset.tab==="today"?todayKey():undefined));
document.getElementById("prevD").onclick=()=>{cur=shiftDay(cur,-1);render();};
document.getElementById("nextD").onclick=()=>{ if(cur>=todayKey()){toast("あしたの記録はまだ書けません");return;} cur=shiftDay(cur,1);render(); };

dLabel.onclick=()=>{
  openSheet("日付を選ぶ"); shSeg.innerHTML="";
  shBody.innerHTML=`<div class="fld"><label for="jumpDate">記録する日</label><input id="jumpDate" type="date" value="${cur}" max="${todayKey()}"></div>
    <button class="btn" onclick="jumpToDate()">この日を開く</button>
    <button class="btn sub" onclick="closeSheet();cur=todayKey();render()">きょうに戻る</button>`;
};
function jumpToDate(){
  const k=document.getElementById("jumpDate").value;
  if(!validDate(k)||k>todayKey()){toast("今日以前の日付を選んでください");return;}
  cur=k;closeSheet();render();
}

window.addEventListener("scroll",()=>{ document.getElementById("top").classList.toggle("scrolled",window.scrollY>4); });

render();

/* ---- 同期のきっかけ：開いたとき・画面に戻ったとき・入力を終えたとき・1分ごと ---- */
(async()=>{
  if(await finishAuth().catch(e=>{ toast("つなげませんでした："+e.message); return false; })){ go("set"); toast("Dropbox につながりました"); }
  syncNow(false);
})();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") requestSync(0); });
window.addEventListener("online",()=>requestSync(0));
main.addEventListener("focusout",()=>{ if(syncState.pending){ syncState.pending=false; requestSync(800); } });
setInterval(()=>{ if(document.visibilityState==="visible"&&syncOn()) syncNow(false); },60000);
if(storageBlocked) showSaveError();
