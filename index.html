<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="カロリー帳">
<meta name="theme-color" content="#2f7d63">
<title>カロリー帳</title>
<style>
:root{
  --bg:#f3f4f2; --card:#ffffff; --ink:#1d2321; --sub:#6b7472; --line:#dfe3e0;
  --accent:#2f7d63; --accent-w:#e6f1ec;
  --in:#c2683f;      /* 摂取 */
  --out:#2f7d63;     /* 消費 */
  --minus:#2f7d63;   /* 収支マイナス＝よい */
  --plus:#c0492f;    /* 収支プラス＝オーバー */
  --shadow:0 1px 3px rgba(0,0,0,.07), 0 6px 18px rgba(0,0,0,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191a; --card:#1f2426; --ink:#e8ecea; --sub:#99a4a1; --line:#333b3d;
    --accent:#63c39f; --accent-w:#22322c;
    --in:#e08a5c; --out:#63c39f; --minus:#63c39f; --plus:#e8705a;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px; line-height:1.55;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}

/* ---- 画面わく ---- */
.wrap{max-width:520px;margin:0 auto;padding:0 14px}
header.top{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding-top:calc(env(safe-area-inset-top) + 8px);
  border-bottom:1px solid transparent;
}
header.top.scrolled{border-bottom-color:var(--line)}
.datebar{display:flex;align-items:center;gap:8px;padding:2px 0 10px}
.datebar .d{flex:1;text-align:center;font-weight:700;font-size:1.05rem}
.datebar .d small{display:block;font-weight:500;font-size:.72rem;color:var(--sub);letter-spacing:.04em}
.navbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);box-shadow:var(--shadow);font-size:1.1rem;color:var(--sub)}
.navbtn:active{transform:scale(.93)}
.today-chip{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 54px);
  font-size:.7rem;background:var(--accent-w);color:var(--accent);padding:3px 9px;border-radius:99px;font-weight:700}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2.sec{font-size:.82rem;letter-spacing:.06em;color:var(--sub);margin:18px 4px 8px;font-weight:700}

/* ---- 収支カード ---- */
.balance{text-align:center;padding:18px 14px 14px}
.balance .num{font-size:2.9rem;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.balance .num .u{font-size:1rem;font-weight:600;margin-left:3px}
.balance .lbl{font-size:.78rem;color:var(--sub);margin-bottom:6px}
.balance .note{font-size:.78rem;color:var(--sub);margin-top:8px}
.bars{margin-top:14px;display:grid;gap:9px}
.barrow{display:grid;grid-template-columns:3.2em 1fr 5.2em;align-items:center;gap:8px;font-size:.8rem}
.barrow .cap{color:var(--sub)}
.barrow .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.track{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
.goalbar{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:.8rem;color:var(--sub);
  display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goalbar b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---- 一覧 ---- */
.slot{margin-bottom:10px}
.slot-head{display:flex;align-items:center;gap:8px;padding:0 4px 5px}
.slot-head .t{font-weight:700;font-size:.9rem}
.slot-head .k{margin-left:auto;font-size:.8rem;color:var(--sub);font-variant-numeric:tabular-nums}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.94rem}
.item .nm em{font-style:normal;color:var(--sub);font-size:.8rem;margin-left:5px}
.item .kc{font-variant-numeric:tabular-nums;font-weight:700;font-size:.94rem}
.item .del{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--sub);font-size:1.1rem;flex:none}
.item .del:active{background:var(--line)}
.addrow{display:flex;align-items:center;gap:7px;padding:11px 13px;color:var(--accent);font-weight:700;font-size:.9rem;width:100%}
.addrow .p{width:21px;height:21px;border-radius:50%;background:var(--accent-w);display:grid;place-items:center;font-size:.95rem;line-height:1}
.empty{padding:16px 13px;color:var(--sub);font-size:.85rem;text-align:center}

/* ---- 体重 ---- */
.wrow{display:flex;align-items:center;gap:10px}
.wrow .lb{font-size:.9rem;font-weight:700}
.wrow input{flex:1;min-width:0;text-align:right;background:transparent;border:none;
  font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;padding:2px 0}
.wrow input:focus{outline:none}
.wrow .u{color:var(--sub);font-size:.9rem}
.wrow .diff{font-size:.78rem;color:var(--sub);font-variant-numeric:tabular-nums}

/* ---- 内訳 ---- */
.kv{display:flex;justify-content:space-between;font-size:.85rem;padding:5px 0}
.kv span:first-child{color:var(--sub)}
.kv b{font-variant-numeric:tabular-nums;font-weight:700}
.kv.tot{border-top:1px solid var(--line);margin-top:5px;padding-top:9px}

/* ---- タブバー ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{padding:7px 0 6px;display:grid;justify-items:center;gap:2px;color:var(--sub);font-size:.66rem;font-weight:700}
nav.tabs button .ic{font-size:1.25rem;line-height:1.1}
nav.tabs button.on{color:var(--accent)}

/* ---- シート（追加パネル） ---- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:20px 20px 0 0;transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.9,.4,1);
  max-height:92vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;padding:6px 14px 10px;flex:none}
.sheet .sh .ti{font-weight:800;font-size:1.02rem}
.sheet .sh .cl{margin-left:auto;color:var(--accent);font-weight:700;font-size:.9rem;padding:4px 2px}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px;margin:0 14px 10px;flex:none}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:.82rem;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 16px;flex:1}
.srch{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);margin-bottom:10px}
.srch:focus{outline:2px solid var(--accent-w);border-color:var(--accent)}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.pick .nm{flex:1;min-width:0;font-size:.94rem}
.pick .nm small{display:block;color:var(--sub);font-size:.72rem}
.pick .kc{color:var(--sub);font-size:.86rem;font-variant-numeric:tabular-nums}
.pick .st{width:28px;height:28px;border-radius:50%;background:var(--accent-w);color:var(--accent);
  display:grid;place-items:center;font-size:1.05rem;flex:none}
.pick:active{background:var(--bg)}
.qty{display:flex;gap:6px;margin:4px 0 12px}
.qty button{flex:1;padding:9px 0;border-radius:9px;background:var(--bg);font-weight:700;font-size:.85rem;color:var(--sub)}
.qty button.on{background:var(--accent);color:#fff}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:.76rem;color:var(--sub);font-weight:700;margin-bottom:4px}
.fld input,.fld select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.fld input:focus,.fld select:focus{outline:2px solid var(--accent-w);border-color:var(--accent)}
.fld .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:1rem;margin-top:4px}
.btn:active{opacity:.85}
.btn.sub{background:var(--bg);color:var(--ink)}
.btn.warn{background:var(--bg);color:var(--plus)}
.chk{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--sub);margin:8px 0 2px}
.chk input{width:19px;height:19px;accent-color:var(--accent)}

/* ---- 写真でしらべる ---- */
.step{border-left:2px solid var(--line);padding:0 0 16px 15px;margin-left:9px;position:relative}
.step:last-of-type{border-left-color:transparent;padding-bottom:2px}
.step .no{position:absolute;left:-11px;top:1px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center}
.step h4{margin:0 0 5px;font-size:.92rem;font-weight:700}
.step p{margin:0 0 9px;font-size:.78rem;color:var(--sub);line-height:1.65}
a.btn{display:block;text-align:center;text-decoration:none}
textarea.ta{width:100%;min-height:104px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);resize:vertical;line-height:1.65;font-size:16px;font-family:inherit}
textarea.ta:focus{outline:2px solid var(--accent-w);border-color:var(--accent)}
textarea.ta.ro{height:190px;color:var(--sub);line-height:1.7}
.res{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
.res input[type=checkbox]{width:21px;height:21px;accent-color:var(--accent);flex:none}
.res .nm{flex:1;min-width:0;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res input[type=number]{width:4.7em;text-align:right;padding:6px 7px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);font-size:16px}
.res .u{font-size:.72rem;color:var(--sub)}
.res.off{opacity:.4}
.sumline{display:flex;justify-content:space-between;align-items:baseline;padding:11px 2px 4px;font-size:.85rem}
.sumline b{font-size:1.15rem;font-variant-numeric:tabular-nums}

/* ---- 履歴 ---- */
.hrow{display:grid;grid-template-columns:4.6em 1fr auto;gap:8px;align-items:center;
  padding:10px 13px;border-bottom:1px solid var(--line);font-size:.88rem}
.hrow:last-child{border-bottom:none}
.hrow .dd{color:var(--sub);font-size:.8rem;font-variant-numeric:tabular-nums}
.hrow .mini{display:flex;gap:1px;height:8px;align-items:center}
.hrow .bal{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:4.4em}
.chart{width:100%;height:150px;display:block}
.chart-lg{font-size:9px;fill:var(--sub)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat div b{display:block;font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat div span{font-size:.7rem;color:var(--sub)}

/* ---- 設定 ---- */
.help{font-size:.8rem;color:var(--sub);line-height:1.7}
.help b{color:var(--ink)}
.help ul{padding-left:1.15em;margin:6px 0}
details summary{font-weight:700;font-size:.9rem;cursor:pointer;padding:3px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";color:var(--sub)}
details[open] summary::before{content:"▾ "}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.85rem;font-weight:700;
  z-index:60;opacity:0;pointer-events:none;transition:.22s}
.toast.on{opacity:.95;transform:translate(-50%,0)}
.hide{display:none !important}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.datebar .d{border-radius:10px;padding:5px;min-height:44px}
.navbtn:disabled{opacity:.3;cursor:default}
.item button.nm{text-align:left;white-space:normal;overflow-wrap:anywhere}
.item .del{width:44px;height:44px}
.sheet{max-width:560px;margin:auto;visibility:hidden}
.sheet.on{visibility:visible}
.toast{max-width:calc(100% - 24px);border-radius:14px;text-align:center}
.toast button{margin-left:12px;text-decoration:underline;min-height:32px;font-weight:800}
.toast.on{pointer-events:auto}
.save-error{position:sticky;bottom:68px;z-index:70;background:#fff0ed;color:#802e20;padding:12px;border:2px solid #c0492f;margin:12px;border-radius:12px}
.app-title{font-size:.74rem;font-weight:700;letter-spacing:.12em;color:var(--accent);text-align:center;padding:4px 0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="wrap">
    <div class="app-title">カロリー帳</div>
    <div class="datebar" id="datebar">
      <button class="navbtn" id="prevD" aria-label="前の日">‹</button>
      <button class="d" id="dLabel" aria-label="日付を選ぶ">—</button>
      <button class="navbtn" id="nextD" aria-label="次の日">›</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav class="tabs">
  <button data-tab="today" class="on"><span class="ic">📝</span>きょう</button>
  <button data-tab="hist"><span class="ic">📈</span>きろく</button>
  <button data-tab="fav"><span class="ic">⭐</span>定番</button>
  <button data-tab="set"><span class="ic">⚙️</span>設定</button>
</nav>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" inert>
  <div class="grab"></div>
  <div class="sh"><div class="ti" id="shTitle">追加</div><button class="cl" id="shClose">閉じる</button></div>
  <div id="shSeg"></div>
  <div class="sbody" id="shBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="saveError" class="save-error hide" role="alert"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hide">

/* Shared validation for existing v1 data and imported backups. */
function validDate(k){return /^\d{4}-\d{2}-\d{2}$/.test(k)&&keyOf(dateOf(k))===k;}
function validNumber(v,min,max){return typeof v==="number"&&Number.isFinite(v)&&v>=min&&v<=max;}
function validateProfile(p){
  if(!["male","female"].includes(p.sex)||!validNumber(p.activity,1,3)||!validNumber(p.deficit,0,5000)) throw new Error("活動量・目標の数値を確認してください");
  if(p.age!==null&&!validNumber(p.age,1,120)) throw new Error("年齢は1〜120で入力してください");
  if(p.height!==null&&!validNumber(p.height,50,250)) throw new Error("身長は50〜250cmで入力してください");
  if(p.goalWeight!==null&&!validNumber(p.goalWeight,1,500)) throw new Error("目標体重は1〜500kgで入力してください");
}
function validateDB(src){
  const object=v=>v&&typeof v==="object"&&!Array.isArray(v);
  const fail=()=>{throw new Error("バックアップの形式または数値が不正です");};
  if(!object(src)||src.version!==1||!object(src.days)||!object(src.weights)||!object(src.profile)) fail();
  const d=structuredClone(DEFAULT);
  for(const k of Object.keys(d.profile)) if(Object.hasOwn(src.profile,k)) d.profile[k]=src.profile[k];
  validateProfile(d.profile);
  const row=(r,kind)=>{
    if(!object(r)||typeof r.name!=="string"||!r.name.trim()||r.name.length>300) fail();
    const out={id:uid(),name:r.name.trim()};
    if(kind==="meal"||kind==="food"){
      if(!validNumber(r.kcal,0,50000)) fail();out.kcal=r.kcal;
      if(kind==="meal"){
        if(!SLOTS.some(s=>s[0]===r.slot)||!validNumber(r.q??1,0.01,100)) fail();
        out.slot=r.slot;out.q=r.q??1;
      }else out.slot=SLOTS.some(s=>s[0]===r.slot)?r.slot:null;
    }else{
      if(!validNumber(r.mets,1,30)||!validNumber(r.min,1,1440)) fail();
      out.mets=r.mets;out.min=r.min;
      if(kind==="exercise"){if(!validNumber(r.kcal,0,100000)) fail();out.kcal=r.kcal;}
    }
    return out;
  };
  for(const [k,v] of Object.entries(src.weights)){
    if(!validDate(k)||!validNumber(v,0.1,500)) fail();d.weights[k]=v;
  }
  for(const [k,v] of Object.entries(src.days)){
    if(!validDate(k)||!object(v)||!Array.isArray(v.meals)||!Array.isArray(v.exs)) fail();
    d.days[k]={meals:v.meals.map(x=>row(x,"meal")),exs:v.exs.map(x=>row(x,"exercise"))};
  }
  if(!Array.isArray(src.favFoods)||!Array.isArray(src.favExs)) fail();
  d.favFoods=src.favFoods.map(x=>row(x,"food"));d.favExs=src.favExs.map(x=>row(x,"ex"));
  return d;
}

    updates={...updates,min,mets,kcal:exKcal(mets,min,st.date)};

  Object.assign(r,updates);if(!save())return;closeSheet();render();toast("変更しました");
}
function removeEntry(kind,id){
  const k=cur,a=day(k)[kind],i=a.findIndex(x=>x.id===id);if(i<0)return;
  const [row]=a.splice(i,1);if(!save()){render();return;}render();toast("削除しました");

/* ---- 日付まわり ---- */
function todayKey(){ return keyOf(new Date()); }
function keyOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dateOf(k){ const[a,b,c]=k.split("-").map(Number); return new Date(a,b-1,c); }
function shiftDay(k,n){ const d=dateOf(k); d.setDate(d.getDate()+n); return keyOf(d); }
function labelOf(k){
  const d=dateOf(k), w="日月火水木金土"[d.getDay()];
  return (d.getMonth()+1)+"月"+d.getDate()+"日（"+w+"）";
}
function day(k){
  if(!DB.days[k]) DB.days[k]={meals:[],exs:[]};
  const d=DB.days[k];
  if(!d.meals) d.meals=[]; if(!d.exs) d.exs=[];
  return d;
}

/* ---- 体重 ---- */
function weightAt(k){
  // その日の体重。なければ直近の過去の記録をさかのぼって使う
  const keys=Object.keys(DB.weights).sort();
  let w=null;
  for(const kk of keys){ if(kk<=k) w=DB.weights[kk]; }

  return w;
}

/* ---- カロリー計算 ---- */
function bmrOf(k){
  // Mifflin-St Jeor 式
  const p=DB.profile, w=weightAt(k);
  if(!w||!p.height||!p.age) return null;
  const base=10*w+6.25*p.height-5*p.age;
  return Math.round(p.sex==="female" ? base-161 : base+5);
}
function lifeOf(k){
  // 生活の活動でふえる分（基礎代謝×活動係数 − 基礎代謝）
  const b=bmrOf(k); if(b==null) return null;
  return Math.round(b*(DB.profile.activity-1));
}
function exKcal(mets,min,k){
  // 運動でふえた分。基礎代謝ぶん（1METs）は別に数えているので引く
  const w=weightAt(k); if(!w) return 0;
  return Math.round((mets-1)*1.05*w*(min/60));
}
function totals(k){
  const d=day(k);
  const inK=d.meals.reduce((s,m)=>s+m.kcal,0);
  const exK=d.exs.reduce((s,e)=>s+exKcal(e.mets,e.min,k),0);
  const b=bmrOf(k), l=lifeOf(k);
  const outK=(b==null)?exK:(b+l+exK);
  return {inK,exK,bmr:b,life:l,outK,bal:inK-outK,ready:b!=null};
}

  /* 体重 */

function allKeys(){
  const s=new Set([...Object.keys(DB.days).filter(k=>day(k).meals.length||day(k).exs.length),...Object.keys(DB.weights)]);
  return [...s].sort();
}
function balChart(keys){
  if(!keys.length) return `<div class="empty">記録がたまるとグラフが出ます</div>`;
  const W=340,H=140,pad=18;
  const vals=keys.map(k=>{const t=totals(k);return t.ready?t.bal:0;});
  const mx=Math.max(400,DB.profile.deficit,...vals.map(Math.abs));
  const bw=(W-pad*2)/keys.length;
  const zero=H/2;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  s+=`<line x1="${pad}" y1="${zero}" x2="${W-pad}" y2="${zero}" stroke="var(--line)" stroke-width="1"/>`;
  // 目標ライン
  const gy=zero+ (DB.profile.deficit/mx)*(H/2-10);
  s+=`<line x1="${pad}" y1="${gy}" x2="${W-pad}" y2="${gy}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>`;
  keys.forEach((k,i)=>{
    const v=vals[i], hgt=Math.abs(v)/mx*(H/2-10);
    const x=pad+i*bw+bw*0.18, w=bw*0.64;
    const y=v<0?zero:zero-hgt;
    s+=`<rect x="${x}" y="${v<0?zero:zero-hgt}" width="${w}" height="${Math.max(hgt,1)}" rx="2" fill="${v<=0?'var(--minus)':'var(--plus)'}" opacity=".85"/>`;
  });
  s+=`</svg><div style="display:flex;justify-content:space-between;font-size:.68rem;color:var(--sub);padding:0 18px">
      <span>${labelShort(keys[0])}</span><span style="color:var(--accent)">‑‑ 目標 −${DB.profile.deficit}</span><span>${labelShort(keys[keys.length-1])}</span></div>`;
  return s;
}
function weightChart(){
  const ks=Object.keys(DB.weights).sort().slice(-60);
  if(ks.length<2) return `<div class="empty">体重を2日ぶん入れるとグラフが出ます</div>`;
  const W=340,H=140,pad=24;
  const vs=ks.map(k=>DB.weights[k]);
  let lo=Math.min(...vs), hi=Math.max(...vs);
  if(DB.profile.goalWeight) hi=Math.max(hi,DB.profile.goalWeight);
  if(DB.profile.goalWeight) lo=Math.min(lo,DB.profile.goalWeight);
  const m=Math.max(1,(hi-lo)*0.25); lo-=m; hi+=m;
  const t0=dateOf(ks[0]).getTime(), t1=dateOf(ks[ks.length-1]).getTime();
  const X=k=>pad+((dateOf(k).getTime()-t0)/Math.max(1,t1-t0))*(W-pad*2);
  const Y=v=>H-16-((v-lo)/(hi-lo))*(H-30);
  let d="",dots="";
  ks.forEach((k,i)=>{ const x=X(k),y=Y(DB.weights[k]); d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1); dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="var(--accent)"/>`; });
  let g="";
  if(DB.profile.goalWeight){ const gy=Y(DB.profile.goalWeight);
    g=`<line x1="${pad}" y1="${gy}" x2="${W-pad}" y2="${gy}" stroke="var(--plus)" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>
       <text class="chart-lg" x="${W-pad}" y="${gy-4}" text-anchor="end" fill="var(--plus)">目標 ${DB.profile.goalWeight}kg</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <text class="chart-lg" x="2" y="${Y(hi-m).toFixed(1)}">${(hi-m).toFixed(1)}</text>
    <text class="chart-lg" x="2" y="${Y(lo+m).toFixed(1)}">${(lo+m).toFixed(1)}</text>
    ${g}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <text class="chart-lg" x="${pad}" y="${H-2}">${labelShort(ks[0])}</text>
    <text class="chart-lg" x="${W-pad}" y="${H-2}" text-anchor="end">${labelShort(ks[ks.length-1])}</text>
  </svg>`;
}

  if(e.key==="Tab"){
    const a=[...sheet.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled&&x.getClientRects().length);
    if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus();}

      <button class="btn" onclick="copyPrompt()">📋 質問文をコピー</button>
      <details style="margin-top:9px"><summary>中身を見る・手で選んでコピーする</summary>
        <textarea class="ta ro" id="pPrompt" readonly>${esc(PHOTO_PROMPT)}</textarea>
      </details>
    </div>
    <div class="step"><span class="no">2</span>
      <h4>Claudeで写真を撮って、貼る</h4>
      <p>Claudeを開いたら、カメラで食事を撮って、さっきの文を貼りつけて送ります。</p>

function copyPrompt(){
  const done=()=>toast("質問文をコピーしました");
  const fallback=()=>{
    const d=shBody.querySelector("details"); if(d) d.open=true;
    const ta=document.getElementById("pPrompt");
    if(ta){ ta.focus(); ta.setSelectionRange(0,PHOTO_PROMPT.length); toast("長押しして「コピー」を選んでください"); }
    else toast("コピーできませんでした");
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(PHOTO_PROMPT).then(done).catch(fallback);
  }else fallback();
}
/* Claudeの返事から「品名 と カロリー」を拾う。形式が多少ぶれても拾えるようにしてある */
function parseMealText(raw){
  const out=[]; let claimed=null;
  for(let line of String(raw).replace(/\r/g,"").split("\n")){
    line=line.replace(/[*`_]/g,"").trim();
    if(!line) continue;
    if(/^[=\-–—_]{3,}$/.test(line)) continue;
    // 箇条書きの記号や番号を先に落とす（「- 合計 | 614」を合計と見抜くため）
    line=line.replace(/^[-–—・●○◆■□☆★•]+\s*/,"").replace(/^\d+[.)）]\s*/,"").trim();
    if(!line) continue;
    const isTotal=/^[【\[(（]?\s*(合計|計|総計|トータル|total)/i.test(line);
    if(/^[【\[(（]?\s*(記録|こんだて|献立|内訳|以上|品名)/.test(line)&&!isTotal) continue;
    let m=line.match(/^(.+?)\s*[|｜:：]\s*(?:約|およそ)?\s*([0-9]{1,5})\s*(?:kcal|キロカロリー|カロリー)?\s*[)）】\]]?\s*$/i)
       || line.match(/^(.+?)[\s.、,:：…・]*(?:約|およそ)?\s*([0-9]{1,5})\s*(?:kcal|キロカロリー)\s*[)）】\]]?\s*$/i);
    if(!m) continue;
    const kcal=parseInt(m[2],10);
    if(!isFinite(kcal)||kcal<=0||kcal>5000) continue;
    if(isTotal){ claimed=kcal; continue; }
    let name=m[1].replace(/[\s:：|｜【\[]+$/,"").trim();
    if(!name||name.length>30) continue;   // 長すぎるのは地の文が紛れこんだもの
    out.push({name,kcal,on:true});
  }
  return {items:out,claimed};
}
function readAnswer(){
  const ta=document.getElementById("pAns");
  const txt=ta?ta.value:"";
  sheetState.ans=txt;
  if(!txt.trim()){ toast("答えを貼りつけてください"); return; }
  const r=parseMealText(txt);
  if(!r.items.length){
    toast("品名とカロリーが読み取れませんでした");
    return;
  }
  sheetState.parsed=r.items; sheetState.claimed=r.claimed;
  drawPhotoResult();
}
function drawPhotoResult(){
  const st=sheetState, slotName=SLOTS.find(x=>x[0]===st.slot)[1];
  let h=`<p style="font-size:.8rem;color:var(--sub);margin:2px 0 10px">
    ${st.parsed.length}品 読み取りました。いらないものはチェックを外し、数字は直せます。</p>`;
  st.parsed.forEach((it,i)=>{
    h+=`<div class="res${it.on?"":" off"}" id="res${i}">
      <input type="checkbox" id="rc${i}" ${it.on?"checked":""} onchange="togRes(${i})">
      <span class="nm" onclick="document.getElementById('rc${i}').click()">${esc(it.name)}</span>
      <input type="number" inputmode="numeric" value="${it.kcal}" onchange="setResK(${i},this)">
      <span class="u">kcal</span></div>`;
  });
  h+=`<div class="sumline"><span>${esc(slotName)}に追加する合計</span><b id="resSum">0</b></div>`;
  if(st.claimed!=null) h+=`<p style="font-size:.74rem;color:var(--sub);margin:0 0 8px">Claudeの言う合計は ${st.claimed} kcal</p>`;
  h+=`<button class="btn" onclick="addParsed()">この内容で追加する</button>
      <button class="btn sub" style="margin-top:8px" onclick="backToPhoto()">貼りなおす</button>`;
  shBody.innerHTML=h;
  updResSum();
}
function togRes(i){
  const cb=document.getElementById("rc"+i);
  sheetState.parsed[i].on=cb.checked;
  document.getElementById("res"+i).classList.toggle("off",!cb.checked);
  updResSum();
}
function setResK(i,el){
  const v=parseInt(el.value,10);
  if(!Number.isFinite(v)||v<0||v>50000){el.value=sheetState.parsed[i].kcal;toast("カロリーは0〜50000で入力してください");return;}
  sheetState.parsed[i].kcal=v;
  updResSum();
}
function updResSum(){
  const el=document.getElementById("resSum"); if(!el) return;
  el.textContent=sheetState.parsed.filter(x=>x.on).reduce((s,x)=>s+x.kcal,0)+" kcal";
}
function backToPhoto(){ sheetState.parsed=null; sheetState.claimed=null; drawPhoto(); }
function addParsed(){
  const picked=sheetState.parsed.filter(x=>x.on&&x.kcal>0);
  if(!picked.length){ toast("追加するものがありません"); return; }
  for(const it of picked) day(cur).meals.push({id:uid(),name:it.name,kcal:it.kcal,q:1,slot:sheetState.slot});
  save(); toast(picked.length+"品を追加しました"); closeSheet(); render();
}
function delMeal(id){ removeEntry("meals",id); }

/* ---- 運動を追加 ---- */
function openEx(){
  if(!weightAt(cur)){ toast("先に体重を入れてください"); return; }

  openSheet("運動を追加");
  shSeg.innerHTML=`<div class="seg">
    <button data-m="fav">⭐ 定番</button><button data-m="search">🔍 さがす</button><button data-m="manual">✏️ 手入力</button></div>`;
  shSeg.querySelectorAll("button").forEach(b=>b.onclick=()=>{sheetState.mode=b.dataset.m;drawEx();});
  drawEx();
}
function drawEx(){
  const st=sheetState;
  shSeg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===st.mode));
  let h="";

  if(st.mode==="fav"){
    if(!DB.favExs.length) h+=`<div class="empty">「定番」タブで登録すると、ここから1タップで入ります</div>`;

      h+=`<button class="pick" onclick="addEx('${jsq(f.name)}',${f.mets},${f.min})">
        <span class="nm">${esc(f.name)}<small>${f.min}分</small></span>

    });
  }
  else if(st.mode==="search"){
    h+=`<input class="srch" id="eq" type="search" placeholder="運動名でさがす（例：歩）" value="${esc(st.q)}">`+mins;
    let list=EXS; const q=st.q.trim();
    if(q) list=EXS.filter(e=>e[0].includes(q));

      h+=`<button class="pick" onclick="addEx('${jsq(e[0])}',${e[1]},${st.min})">
        <span class="nm">${esc(e[0])}<small>${e[1]} METs</small></span>
        <span class="kc">${exKcal(e[1],st.min,cur)} kcal</span><span class="st">＋</span></button>`;
    });
  }
  else{
    h+=`<div class="fld"><label for="eName">名前</label><input id="eName" type="text" maxlength="300" placeholder="例：犬の散歩"></div>
      <div class="fld"><div class="two">
        <div><label for="eMin">時間（分）</label><input id="eMin" type="number" inputmode="numeric" value="30"></div>
        <div><label for="eMets">強さ METs</label><input id="eMets" type="number" inputmode="decimal" step="0.1" value="4.0"></div>
      </div></div>
      <div class="help" style="margin-bottom:10px">METsの目安：のんびり歩く3／速歩4.3／自転車6.8／ジョギング8.3／筋トレ6</div>
      <label class="chk"><input type="checkbox" id="eFav">定番にも登録しておく</label>
      <button class="btn" onclick="addManualEx()">追加する</button>`;
  }
  shBody.innerHTML=h;
  const eq=document.getElementById("eq");
  if(eq){ eq.oninput=()=>{st.q=eq.value; const p=eq.selectionStart; drawEx(); const n=document.getElementById("eq"); n.focus(); n.setSelectionRange(p,p);}; }

function setMin(m){ sheetState.min=m; drawEx(); }
function addEx(name,mets,min){
  day(cur).exs.push({id:uid(),name,mets,min,kcal:exKcal(mets,min,cur)});
  save(); toast(name+" を追加"); closeSheet(); render();
}
function addManualEx(){
  const n=document.getElementById("eName").value.trim();
  const m=parseInt(document.getElementById("eMin").value);
  const mt=parseFloat(document.getElementById("eMets").value);
  if(!n||n.length>300||!Number.isFinite(m)||m<=0||m>1440||!Number.isFinite(mt)||mt<1||mt>30){ toast("名前・時間（1〜1440分）・METs（1〜30）を確認してください"); return; }
  if(document.getElementById("eFav").checked) DB.favExs.push({id:uid(),name:n,mets:mt,min:m});
  day(cur).exs.push({id:uid(),name:n,mets:mt,min:m,kcal:exKcal(mt,m,cur)});
  save(); toast("追加しました"); closeSheet(); render();
}
function delEx(id){ removeEntry("exs",id); }

/* ---- 定番の編集 ---- */
function openFavEdit(kind){
  sheetState={kind:"favedit",t:kind,mode:"search",q:""};
  openSheet(kind==="food"?"定番の食べもの":"定番の運動");
  shSeg.innerHTML=`<div class="seg"><button data-m="search">🔍 一覧からえらぶ</button><button data-m="manual">✏️ 自分で入れる</button></div>`;
  shSeg.querySelectorAll("button").forEach(b=>b.onclick=()=>{sheetState.mode=b.dataset.m;drawFavEdit();});
  drawFavEdit();

function drawFavEdit(){
  const st=sheetState;
  shSeg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===st.mode));

  if(st.mode==="search"){
    h+=`<input class="srch" id="vq" type="search" placeholder="名前でさがす" value="${esc(st.q)}">`;
    const q=st.q.trim();

      let list=q?FOODS.filter(f=>f[0].includes(q)||f[2].includes(q)):FOODS;

        <span class="nm">${esc(f[0])}${f[3]?`<small>${f[3]}</small>`:""}</span><span class="kc">${f[1]} kcal</span><span class="st">＋</span></button>`; });
    }else{
      let list=q?EXS.filter(e=>e[0].includes(q)):EXS;
      list.forEach(e=>{ h+=`<button class="pick" onclick="addFav('ex','${jsq(e[0])}',${e[1]})">
        <span class="nm">${esc(e[0])}<small>${e[1]} METs</small></span><span class="st">＋</span></button>`; });

  }else{
    if(st.t==="food"){

        <div class="fld"><label for="fvK">カロリー (kcal)</label><input id="fvK" type="number" inputmode="numeric"></div>
        <button class="btn" onclick="addFavManual()">登録する</button>`;
    }else{
      h+=`<div class="fld"><label for="fvN">名前</label><input id="fvN" type="text" maxlength="300" placeholder="例：朝のウォーキング"></div>
        <div class="fld"><div class="two">
          <div><label for="fvM">時間（分）</label><input id="fvM" type="number" inputmode="numeric" value="30"></div>
          <div><label for="fvT">強さ METs</label><input id="fvT" type="number" inputmode="decimal" step="0.1" value="4.0"></div>
        </div></div>
        <button class="btn" onclick="addFavManual()">登録する</button>`;
    }
  }
  shBody.innerHTML=h;

}
function addFav(t,name,v){
  if(t==="food") DB.favFoods.push({id:uid(),name,kcal:v,slot:null});
  else DB.favExs.push({id:uid(),name,mets:v,min:30});
  save(); toast("登録しました"); closeSheet(); renderFav();
}
function addFavManual(){
  const n=document.getElementById("fvN").value.trim();
  if(!n||n.length>300){ toast("名前は1〜300文字で入力してください"); return; }
  if(sheetState.t==="food"){
    const k=parseInt(document.getElementById("fvK").value);
    if(!Number.isFinite(k)||k<0||k>50000){ toast("カロリーは0〜50000で入力してください"); return; }
    DB.favFoods.push({id:uid(),name:n,kcal:k,slot:null});
  }else{
    const m=parseInt(document.getElementById("fvM").value), t=parseFloat(document.getElementById("fvT").value);
    if(!Number.isFinite(m)||m<=0||m>1440||!Number.isFinite(t)||t<1||t>30){ toast("時間（1〜1440分）とMETs（1〜30）を確認してください"); return; }
    DB.favExs.push({id:uid(),name:n,mets:t,min:m});
  }
  save(); toast("登録しました"); closeSheet(); renderFav();
}

/* ============================================================
   書き出し／読みこみ
   ============================================================ */
function expo(){
  const d=new Date();
  const fn="dietlog_"+keyOf(d).replace(/-/g,"")+".json";
  const blob=new Blob([storageBlocked ? (localStorage.getItem(KEY)||"{}") : JSON.stringify(DB,null,1)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=fn; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1500);
  toast("書き出しました");
}
document.getElementById("fileIn").addEventListener("change",async function(){
  const f=this.files[0]; this.value=""; if(!f) return;
  try{
    if(f.size>10000000) throw new Error("10MB以下のファイルを選んでください");
    const d=validateDB(JSON.parse(await f.text()));
    sheetState={kind:"import",data:d}; openSheet("バックアップを確認");
    shSeg.innerHTML="";
    shBody.innerHTML=`<p>食事・運動 ${Object.keys(d.days).length}日／体重 ${Object.keys(d.weights).length}日</p>
      <p class="help">読み込む方法を選んでください。置き換える前に、今のデータを書き出して保管できます。</p>
      <button class="btn sub" onclick="expo()">今のデータを書き出す</button>
      <button class="btn" onclick="applyImport(false)">記録のない日だけ追加</button>
      <button class="btn warn" onclick="applyImport(true)">すべて置き換える…</button>`;
  }catch(e){toast("読み込めません："+e.message);}
});
function applyImport(replace){
  const d=sheetState.data;
  if(replace&&!confirm("今の記録・設定・定番をバックアップの内容に置き換えます。よろしいですか？")) return;
  if(storageBlocked&&!replace){toast("元データを保護中です。書き出して保管し、置き換えを選んでください");return;}
  const wasBlocked=storageBlocked;
  if(replace){storageBlocked=false;DB=d;}
  else{
    for(const [k,v] of Object.entries(d.days)) if(!DB.days[k]||(!DB.days[k].meals.length&&!DB.days[k].exs.length)) DB.days[k]=v;
    for(const [k,v] of Object.entries(d.weights)) if(DB.weights[k]==null) DB.weights[k]=v;
    for(const key of ["favFoods","favExs"]){
      const have=new Set(DB[key].map(x=>x.name));
      d[key].forEach(x=>{if(!have.has(x.name)){DB[key].push(x);have.add(x.name);}});
    }
  }
  if(!save()){storageBlocked=wasBlocked;return;}
  closeSheet();cur=todayKey();render();toast("読み込みました");
}

/* ============================================================
   こまごま
   ============================================================ */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
/* onclick="f('…')" の中に入れる用：JS文字列 → HTML属性 の二重エスケープ */
function jsq(s){ return esc(JSON.stringify(String(s)).slice(1,-1).replace(/'/g,"\\'")); }
let toastT;
function toast(msg){
  const t=document.getElementById("toast");
  if(saveFailed){saveFailed=false;return;}
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1700);
}
function go(t,k){ const moved=(tab!==t); tab=t; if(k) cur=k; render(); if(moved) window.scrollTo(0,0); }
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab,b.dataset.tab==="today"?todayKey():undefined));
document.getElementById("prevD").onclick=()=>{cur=shiftDay(cur,-1);render();};
document.getElementById("nextD").onclick=()=>{ if(cur>=todayKey()){toast("あしたの記録はまだ書けません");return;} cur=shiftDay(cur,1);render(); };

dLabel.onclick=()=>{
  openSheet("日付を選ぶ"); shSeg.innerHTML="";
  shBody.innerHTML=`<div class="fld"><label for="jumpDate">記録する日</label><input id="jumpDate" type="date" value="${cur}" max="${todayKey()}"></div>
    <button class="btn" onclick="jumpToDate()">この日を開く</button>
    <button class="btn sub" onclick="closeSheet();cur=todayKey();render()">きょうに戻る</button>`;
};
function jumpToDate(){
  const k=document.getElementById("jumpDate").value;
  if(!validDate(k)||k>todayKey()){toast("今日以前の日付を選んでください");return;}
  cur=k;closeSheet();render();
}

window.addEventListener("scroll",()=>{ document.getElementById("top").classList.toggle("scrolled",window.scrollY>4); });

render();
if(storageBlocked) showSaveError();
